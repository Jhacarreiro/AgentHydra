# Postgres 17 for the AgentHydra API. Loopback only; the password comes from the env file.
services:
  agenthydra-pg:
    image: postgres:17
    container_name: agenthydra-pg
    restart: unless-stopped
    # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, written by bootstrap.sh
    env_file: /etc/agenthydra/pg.env
    environment:
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - agenthydra-pg-data:/var/lib/postgresql/data
volumes:
  agenthydra-pg-data:
    name: agenthydra-pg-data
