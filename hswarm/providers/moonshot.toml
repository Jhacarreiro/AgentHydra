# Moonshot (Kimi).

base_url = "https://api.moonshot.ai/v1"
# Kimi's global platform (platform.kimi.ai: https://platform.kimi.ai/docs/guide/start-using-kimi-api) serves
# api.moonshot.ai/v1 and its China platform (platform.kimi.com: https://platform.kimi.com/docs/guide/start-using-kimi-api)
# api.moonshot.cn/v1, each with its own keys. A key that 401s here is looked for on the other once (client.find_region).
region_base_urls = ["https://api.moonshot.ai/v1", "https://api.moonshot.cn/v1"]
about = "Moonshot's Kimi models. Paid per use."
key_url = "https://platform.kimi.ai/console/api-keys"  # where a person makes an API key
website = "https://platform.kimi.ai"  # the company's site; the console shows its favicon
models_path = "/models"
docs = "https://platform.moonshot.ai/docs"
