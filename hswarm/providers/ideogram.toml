base_url = "https://api.ideogram.ai"
transport = "service"
about = "Ideogram image generation through its multipart REST API. Poll asynchronous generation IDs separately."
website = "https://ideogram.ai"
key_url = "https://ideogram.ai/manage-api"
docs = "https://developer.ideogram.ai/v1/api-reference/generate-images/generate-v4"
auth_header = "Api-Key"
auth_prefix = ""
capabilities = ["image-generation", "generation-status"]

[operations.generate]
method = "POST"
path = "/v1/ideogram-v4/generate"
capability = "image-generation"
input = "multipart"
response = "json"

[operations.get_generation]
method = "GET"
path = "/v1/generations/{generation_id}"
capability = "generation-status"
response = "json"

# Image route for `hswarm image` (image.py). Moderated; no price on record here.
[images.v3-turbo]
adapter = "ideogram"
model = "/v1/ideogram-v3/generate"
modes = ["t2i"]
moderated = true
input = { rendering_speed = "TURBO" }
aspect_ratios = ["1:3", "3:1", "1:2", "2:1", "9:16", "16:9", "10:16", "16:10", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "1:1"]
