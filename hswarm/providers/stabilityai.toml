base_url = "https://api.stability.ai"
transport = "service"
check_path = "/v1/user/balance"
about = "Stability AI Stable Image Core generation and account metadata. Images are base64 encoded in JSON."
website = "https://stability.ai"
key_url = "https://platform.stability.ai/account/keys"
docs = "https://platform.stability.ai/docs/api-reference"
auth_header = "Authorization"
auth_prefix = "Bearer "
capabilities = ["image-generation", "account"]

[headers]
Accept = "application/json"

[operations.generate]
method = "POST"
path = "/v2beta/stable-image/generate/core"
capability = "image-generation"
input = "multipart"
response = "json"

[operations.balance]
method = "GET"
path = "/v1/user/balance"
capability = "account"
response = "json"

[operations.account]
method = "GET"
path = "/v1/user/account"
capability = "account"
response = "json"

# Image routes for `hswarm image` (image.py). Moderated: a 403 "flagged by our content moderation" moves the request to
# the next route. No price on record here, so priced routes are served first.
[images.core]
adapter = "stability"
model = "/v2beta/stable-image/generate/core"
modes = ["t2i"]
moderated = true
aspect_ratios = ["16:9", "1:1", "21:9", "2:3", "3:2", "4:5", "5:4", "9:16", "9:21"]

[images.inpaint]
adapter = "stability"
model = "/v2beta/stable-image/edit/inpaint"
modes = ["fill"]
moderated = true

# One free read per key; the balance is in Stability credits.
[image_balance]
url = "/v1/user/balance"
field = "credits"
unit = "credits"
