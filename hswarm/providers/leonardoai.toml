base_url = "https://cloud.leonardo.ai/api/rest"
transport = "service"
about = "Leonardo image generation through the documented v1 API. Submit a generation then retrieve its result by ID."
website = "https://leonardo.ai"
key_url = "https://app.leonardo.ai/api-access"
docs = "https://docs.leonardo.ai/v1.0/docs/getting-started"
auth_header = "Authorization"
auth_prefix = "Bearer "
capabilities = ["image-generation", "generation-status"]

[operations.generate]
method = "POST"
path = "/v1/generations"
capability = "image-generation"
response = "json"

[operations.get_generation]
method = "GET"
path = "/v1/generations/{generation_id}"
capability = "generation-status"
response = "json"

# Image route for `hswarm image` (image.py): Leonardo's hosted FLUX Schnell, paid in Leonardo API tokens (no USD price
# on record here). Model ids from GET /v1/platformModels (2026-10-16).
[images.flux-schnell]
adapter = "leonardo"
model = "1dd50843-d653-4516-a8e3-f0238ee453ff"
modes = ["t2i"]
moderated = true
max_mp = 2.1

# One free read per key: paid plus subscription API tokens.
[image_balance]
url = "/v1/me"
field = ["user_details.0.apiPaidTokens", "user_details.0.apiSubscriptionTokens"]
unit = "tokens"
