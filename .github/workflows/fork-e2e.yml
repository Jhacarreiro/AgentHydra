name: fork-e2e

# The fork's black-box lane (fork-e2e/README.md): the real daemon, Desk 2's server and the MCP stdio
# server run as child processes in throwaway homes and are driven over HTTP, stdio and raw sockets.
# The job runs only in the fork's own repository (the `if:` below), so a copy of this file anywhere
# else starts nothing. Upstream's own gate stays ci.yml; this lane adds to it.
# Lint and format of fork-e2e/ are already covered by ci.yml's `bun run lint` (biome check .).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily, so a quiet fork still learns when an upstream sync, a runner image or a new Bun patch
  # breaks a scenario, and when an upstream fix turns a known-bug marker red.
  schedule:
    - cron: '23 6 * * *'

concurrency:
  group: fork-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  e2e:
    if: github.repository == 'Jhacarreiro/AgentHydra'
    name: fork-e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-fork-e2e-${{ runner.os }}-${{ hashFiles('bun.lock', 'desk2/bun.lock') }}
          restore-keys: bun-fork-e2e-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # E3 starts Desk 2's server, which resolves its own dependencies.
      - name: Install dependencies (desk2)
        working-directory: desk2
        run: bun install --frozen-lockfile

      - name: Typecheck (fork-e2e)
        working-directory: fork-e2e
        run: bun run typecheck

      # E6 runs the daemon under strace to record every outbound socket call it makes.
      - name: Install strace
        run: command -v strace || { sudo apt-get update && sudo apt-get install -y strace; }

      # FORK_E2E_KEEP keeps every temp home and its logs/ under runner.temp, so a failed run can show
      # what each daemon, Desk 2 and the MCP stdio server printed. FORK_E2E_REQUIRE_STRACE makes E6
      # fail rather than fall back to sampling open sockets if strace cannot trace.
      - name: Test (fork-e2e)
        working-directory: fork-e2e
        env:
          FORK_E2E_TMP: ${{ runner.temp }}/fork-e2e
          FORK_E2E_KEEP: '1'
          FORK_E2E_REQUIRE_STRACE: '1'
        run: bun run test

      - name: Logs of every process the lane started
        if: failure()
        env:
          FORK_E2E_TMP: ${{ runner.temp }}/fork-e2e
        run: |
          shopt -s nullglob
          for f in "$FORK_E2E_TMP"/fork-e2e-*/logs/*.log; do
            echo "::group::$f"
            tail -n 200 "$f"
            echo "::endgroup::"
          done
