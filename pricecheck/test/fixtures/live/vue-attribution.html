<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vue attribution</title>
</head>
<body>
<h1>Pricing</h1>
<div id="badge"><button>Buy now</button></div>
<div id="tag"><a href="#more">More</a></div>
<script>
// Stands in for Vue 3's dev-mode component instance on each host element.
document.getElementById('badge').__vueParentComponent = { type: { __file: '/app/src/components/Badge.vue' } }
document.getElementById('tag').__vueParentComponent = { type: { name: 'PriceTag' } }
</script>
</body>
</html>
