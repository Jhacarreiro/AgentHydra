<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion</title>
<style>
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes slide { from { transform: translateX(0) } to { transform: translateX(40px) } }
.spinner { width: 20px; height: 20px; border: 2px solid #333; animation: spin 1s linear infinite }
.entrance { animation: slide 2s ease-out }
.ticker { animation: slide 8s linear }
.hidden-spinner { display: none; animation: spin 1s linear infinite }
</style>
</head>
<body>
<div class="spinner"></div>
<p class="entrance">Welcome back</p>
<p class="ticker">News of the day</p>
<div class="hidden-spinner"></div>
</body>
</html>
