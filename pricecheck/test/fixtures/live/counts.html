<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counts</title>
<style>
* { font-size: 16px; }
html, body { margin: 0; }
body { background: #fff; color: #000; }
h1 { font-size: 32px; color: rgb(200, 0, 0); }
.small { font-size: 12px; color: rgb(0, 0, 200); }
a { color: #000; }
button, input, select, textarea { background: #fff; }
</style>
</head>
<body>
<h1>Hello world</h1>
<p>one two three four five</p>
<nav><a href="#a">Alpha</a> <a href="#b">Beta</a> <a href="#c">Gamma</a></nav>
<div><button>Save</button> <button>Cancel</button></div>
<label>Name <input type="text"></label>
<label>Notes <textarea></textarea></label>
<select><option>Red</option><option>Green</option><option>Blue</option></select>
<section><h2>Two</h2></section>
<div class="card"><span class="small">Card</span></div>
<svg width="20" height="20"><rect width="10" height="10"/></svg>
<img width="20" height="20" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
<p style="display:none">secret words here</p>
<span style="visibility:hidden">hidden text</span>
<div aria-hidden="true"><button>Ghost</button></div>
<div style="opacity:0"><a href="#x">Invisible</a></div>
<img style="display:none" width="20" height="20" alt="" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
</body>
</html>
