<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>React fiber attribution</title>
</head>
<body>
<div id="card"><button>Add</button></div>
<div id="legal"><a href="#terms">Terms</a></div>
<div role="dialog" aria-label="Offer"><button>Close</button></div>
<script>
// Stands in for React's fiber link on host elements: a host fiber whose .return chain reaches a function fiber.
function ProductCard() {}
function LegalFooter() {}
const hostFiber = (fn) => ({ type: 'div', return: fn })
document.getElementById('card').__reactFiber$pricecheck = hostFiber({
  type: ProductCard,
  _debugSource: { fileName: '/app/src/ProductCard.jsx' },
  return: null,
})
document.getElementById('legal').__reactFiber$pricecheck = hostFiber({ type: LegalFooter, return: null })
</script>
</body>
</html>
