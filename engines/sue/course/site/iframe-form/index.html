<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iframe Form</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        color: #111;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      iframe {
        width: 100%;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-sizing: border-box;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0 0 16px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="form-view" style="display: contents">
        <p class="hint">Read the coupon code from the first frame and apply it in the second.</p>
        <iframe title="coupon-frame" src="coupon-frame.html" style="height: 140px"></iframe>
        <iframe id="checkout-frame" title="checkout-frame" src="checkout-frame.html" style="height: 220px"></iframe>
        <p id="error" class="error" hidden></p>
      </section>
      <p id="success" class="success" hidden>Coupon applied</p>
    </main>
    <script>
      // The checkout frame's Apply button posts the typed code up to this page,
      // which validates it. Only messages from the checkout frame's own window
      // count, so no other frame or opener can drive this state.
      const COUPON_CODE = "SAVE-1234";
      const checkoutFrame = document.getElementById("checkout-frame");
      const error = document.getElementById("error");

      window.addEventListener("message", (event) => {
        if (event.source !== checkoutFrame.contentWindow) return;
        const data = event.data;
        if (typeof data !== "object" || data === null || data.type !== "apply-coupon") return;
        if (typeof data.code !== "string") return;
        if (data.code.trim() === COUPON_CODE) {
          error.hidden = true;
          document.getElementById("form-view").hidden = true;
          document.getElementById("success").hidden = false;
          return;
        }
        error.textContent = "Invalid coupon code";
        error.hidden = false;
      });
    </script>
  </body>
</html>
