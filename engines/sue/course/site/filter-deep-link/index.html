<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/FilterDeepLink.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Filter Deep Link</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 40px auto;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 15px;
      }
      #link {
        font-size: 13px;
        color: #276;
      }
    </style>
  </head>
  <body>
    <h1>Products</h1>
    <p class="hint">Filter the list for the mug; the page address keeps the filter so the view can be shared.</p>
    <input data-testid="filter-input" placeholder="Filter products" aria-label="Filter products" />
    <ul data-testid="product-list"></ul>
    <p data-testid="empty-state" hidden>No products match.</p>
    <p id="link" data-testid="share-link"></p>
    <script>
      const items = ["Trail Backpack", "Steel Water Bottle", "Merino Hiking Socks", "Camp Lantern", "Titanium Mug"];
      const input = document.querySelector("input");
      const list = document.querySelector("ul");
      const empty = document.querySelector("[data-testid=empty-state]");
      const link = document.getElementById("link");

      function render() {
        const q = input.value.toLowerCase();
        const shown = items.filter((n) => n.toLowerCase().includes(q));
        list.replaceChildren(
          ...shown.map((n) => {
            const li = document.createElement("li");
            li.textContent = n;
            return li;
          }),
        );
        empty.hidden = shown.length > 0;
        const p = new URLSearchParams(location.search).get("q");
        link.textContent = p ? "Shareable link: ?q=" + p : "";
      }

      input.addEventListener("input", () => {
        const u = new URL(location.href);
        if (input.value) u.searchParams.set("q", input.value);
        else u.searchParams.delete("q");
        history.replaceState({}, "", u.pathname + u.search + u.hash);
        render();
      });

      input.value = new URLSearchParams(location.search).get("q") || "";
      render();
    </script>
  </body>
</html>
