<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/RichTextEditor.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rich Text Editor</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 520px;
        margin: 40px auto;
        padding: 0 16px;
      }
      #app {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        color: #666;
        font-size: 13px;
        text-align: center;
        margin: 0;
      }
      button {
        background: #111;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        cursor: pointer;
      }
      #bold {
        font-weight: 700;
        width: 44px;
      }
      #editor {
        min-height: 140px;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
        outline: none;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
      }
      .ok {
        color: #0a0;
        font-size: 20px;
        font-weight: 600;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Rich Text Editor</h1>
    <div id="app">
      <p class="hint">Type "release approved" in the editor and make the word approved bold, then check the document.</p>
      <div><button type="button" id="bold" data-testid="bold-button" aria-label="B">B</button></div>
      <div id="editor" data-testid="editor" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Editor"></div>
      <p id="error" class="error" data-testid="error-message" hidden></p>
      <button type="button" id="check" data-testid="check-button">Check document</button>
    </div>
    <script>
      const PHRASE = "release approved",
        WORD = "approved";
      const editor = document.getElementById("editor");
      const err = document.getElementById("error");
      const boldBtn = document.getElementById("bold");
      boldBtn.addEventListener("mousedown", (e) => e.preventDefault());
      boldBtn.addEventListener("click", () => {
        editor.focus();
        document.execCommand("bold");
      });

      function isBold(el) {
        for (; el && el !== editor; el = el.parentElement) {
          if (el.tagName === "B" || el.tagName === "STRONG") return true;
          const w = el.style && el.style.fontWeight;
          if (w === "bold" || Number(w) >= 600) return true;
        }
        return false;
      }
      function fail(msg) {
        err.textContent = msg;
        err.hidden = false;
      }

      document.getElementById("check").addEventListener("click", () => {
        const text = editor.textContent.trim().replace(/\s+/g, " ").toLowerCase();
        if (text !== PHRASE) return fail('Text must be exactly "' + PHRASE + '"');
        const marks = [];
        const walk = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
        for (let n = walk.nextNode(); n; n = walk.nextNode()) {
          const b = isBold(n.parentElement);
          for (const ch of n.textContent) if (/\S/.test(ch)) marks.push(b);
        }
        const start = PHRASE.replace(/\s/g, "").indexOf(WORD);
        if (!marks.every((b, i) => b === i >= start)) return fail("Only the word " + WORD + " must be bold");
        document.getElementById("app").innerHTML = '<p class="ok" data-testid="success-message">Document approved</p>';
      });
    </script>
  </body>
</html>
