<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/VirtualizedTable.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Virtualized Table</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 24px auto;
        padding: 0 12px;
      }
      h1 {
        font-size: 20px;
        text-align: center;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
      }
      #done {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 8px 0;
      }
      #vp {
        height: 480px;
        overflow: auto;
        border: 1px solid #ddd;
        border-radius: 8px;
      }
      #sp {
        position: relative;
      }
      .row {
        position: absolute;
        left: 0;
        right: 0;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        box-sizing: border-box;
        border-bottom: 1px solid #f0f0f0;
        font-size: 14px;
      }
      .gold {
        font-weight: 600;
      }
      button {
        background: #111;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 4px 12px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Virtualized Table</h1>
    <p class="hint">The Golden Row is deep in the table; off-screen rows are not in the DOM.</p>
    <p id="done" data-testid="success-message" hidden>Golden Row claimed</p>
    <div id="vp" data-testid="table-viewport"><div id="sp"></div></div>
    <script>
      const N = 5000,
        H = 36,
        VH = 480,
        EXTRA = 5,
        GOLD = 4321;
      const vp = document.getElementById("vp"),
        sp = document.getElementById("sp");
      sp.style.height = N * H + "px";
      let first = -1,
        last = -1;
      function draw() {
        const a = Math.max(0, Math.floor(vp.scrollTop / H) - EXTRA);
        const b = Math.min(N, Math.ceil((vp.scrollTop + VH) / H) + EXTRA);
        if (a === first && b === last) return;
        first = a;
        last = b;
        sp.textContent = "";
        for (let i = a; i < b; i++) {
          const row = document.createElement("div");
          row.className = "row";
          row.dataset.testid = "table-row";
          row.style.top = i * H + "px";
          const label = document.createElement("span");
          if (i === GOLD) {
            label.className = "gold";
            label.textContent = "Row " + (i + 1) + " \u2014 Golden Row";
            row.append(label);
            const btn = document.createElement("button");
            btn.type = "button";
            btn.dataset.testid = "claim-button";
            btn.textContent = "Claim";
            btn.onclick = () => {
              document.getElementById("done").hidden = false;
            };
            row.append(btn);
          } else {
            label.textContent = "Row " + (i + 1);
            row.append(label);
          }
          sp.append(row);
        }
      }
      vp.addEventListener("scroll", draw);
      draw();
    </script>
  </body>
</html>
