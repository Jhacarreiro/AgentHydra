<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart Totals</title>
<style>
  body { font-family: system-ui, sans-serif; color: #111; margin: 0; }
  main { max-width: 640px; margin: 0 auto; padding: 24px; }
  header a { font-size: 13px; color: #666; }
  h1 { font-size: 20px; font-weight: 700; margin: 8px 0 0; }
  .container { display: flex; flex-direction: column; gap: 20px; padding: 24px 0; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  li { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid #e5e5e5; font-size: 15px; }
  .name { flex: 1; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button { width: 28px; height: 28px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-size: 16px; cursor: pointer; }
  .qty { min-width: 16px; text-align: center; font-variant-numeric: tabular-nums; }
  .line-total { min-width: 72px; text-align: right; font-weight: 600; }
  .summary { border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .summary div { display: flex; justify-content: space-between; }
  .summary .total { border-top: 1px solid #e5e5e5; padding-top: 8px; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<main>
  <header>
    <a href="/">&larr; All pages</a>
    <h1>Cart Totals</h1>
  </header>
  <div class="container">
    <ul id="lines" data-testid="cart-lines"></ul>
    <div class="summary" data-testid="order-summary">
      <div><span>Subtotal</span><span id="subtotal" data-testid="summary-subtotal"></span></div>
      <div><span>Shipping</span><span id="shipping" data-testid="summary-shipping"></span></div>
      <div class="total"><span>Order total</span><span id="total" data-testid="summary-total"></span></div>
    </div>
  </div>
</main>
<script>
  const LINE_ITEMS = [
    { id: "tee", name: "Organic Cotton Tee", unitPrice: 20 },
    { id: "cap", name: "Corduroy Cap", unitPrice: 29 },
  ];
  const SHIPPING = 5;
  const INITIAL_QUANTITIES = { tee: 1, cap: 1 };
  const quantities = { ...INITIAL_QUANTITIES };

  /** Sums line totals for the given quantities. */
  const computeSubtotal = (qty) => LINE_ITEMS.reduce((sum, item) => sum + item.unitPrice * (qty[item.id] ?? 0), 0);

  // PLANTED BUG (do not fix): the order summary is computed once from the
  // initial quantities and never recalculated, so quantity changes update the
  // line totals but leave the summary stale.
  const summarySubtotal = computeSubtotal(INITIAL_QUANTITIES);

  const money = (n) => `$${n.toFixed(2)}`;

  function renderLines() {
    const list = document.getElementById("lines");
    list.replaceChildren(
      ...LINE_ITEMS.map((item) => {
        const quantity = quantities[item.id] ?? 1;
        const row = document.createElement("li");
        row.innerHTML = `
          <span class="name"></span>
          <span class="stepper">
            <button type="button" data-testid="decrease-${item.id}">-</button>
            <span class="qty" data-testid="quantity-${item.id}"></span>
            <button type="button" data-testid="increase-${item.id}">+</button>
          </span>
          <span class="line-total" data-testid="line-total-${item.id}"></span>`;
        row.querySelector(".name").textContent = item.name;
        row.querySelector(".qty").textContent = String(quantity);
        row.querySelector(".line-total").textContent = money(item.unitPrice * quantity);
        row.querySelector(`[data-testid="decrease-${item.id}"]`).addEventListener("click", () => adjustQuantity(item.id, -1));
        row.querySelector(`[data-testid="increase-${item.id}"]`).addEventListener("click", () => adjustQuantity(item.id, 1));
        return row;
      }),
    );
  }

  /** Adjusts a line item quantity, clamped to the 1-9 range. */
  function adjustQuantity(itemId, delta) {
    quantities[itemId] = Math.min(9, Math.max(1, (quantities[itemId] ?? 1) + delta));
    renderLines();
  }

  document.getElementById("subtotal").textContent = money(summarySubtotal);
  document.getElementById("shipping").textContent = money(SHIPPING);
  document.getElementById("total").textContent = money(summarySubtotal + SHIPPING);
  renderLines();
</script>
</body>
</html>
