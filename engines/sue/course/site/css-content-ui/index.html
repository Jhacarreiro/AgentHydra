<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Content UI</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        color: #111;
      }
      .wb-root {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px 0;
      }
      .wb-row {
        display: flex;
        gap: 12px;
      }
      .wb-css-instruction {
        font-size: 13px;
        color: #666;
      }
      .wb-css-action-a,
      .wb-css-action-b,
      .wb-css-action-c {
        min-width: 110px;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 14px 16px;
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        cursor: default;
        user-select: none;
      }
      .wb-css-confirm {
        background: #111;
        color: #fff;
        border-radius: 8px;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 600;
        cursor: default;
        user-select: none;
      }
      .wb-css-error {
        color: #c00;
        font-size: 14px;
      }
      .wb-css-success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
      }

      .wb-css-instruction::before {
        content: "Press Ship it, then confirm";
      }
      .wb-css-action-a::before {
        content: "Archive";
      }
      .wb-css-action-b::before {
        content: "Ship it";
      }
      .wb-css-action-c::before {
        content: "Delete";
      }
      .wb-css-confirm::before {
        content: "Confirm ship";
      }
      .wb-css-error::before {
        content: "Wrong action";
      }
      .wb-css-success::before {
        content: "Shipped successfully";
      }
    </style>
  </head>
  <body>
    <div class="wb-root"></div>
    <script>
      // Every visible string on this page is CSS ::before content, so the DOM is
      // nothing but empty divs with meaningless class names. innerText, text
      // extraction and a11y snapshots come back blank; the labels exist only in
      // the rendered pixels.
      const root = document.querySelector(".wb-root");
      let step = "pick";
      let failed = false;

      function div(className, onClick) {
        const node = document.createElement("div");
        node.className = className;
        if (onClick) node.addEventListener("click", onClick);
        return node;
      }

      // Only the tile painted "Ship it" advances; the others paint the error and
      // keep the picker open.
      function handleAction(correct) {
        if (!correct) {
          failed = true;
        } else {
          failed = false;
          step = "confirm";
        }
        render();
      }

      function render() {
        root.replaceChildren();
        if (step === "pick") {
          root.append(div("wb-css-instruction"));
          const row = div("wb-row");
          row.append(
            div("wb-css-action-a", () => handleAction(false)),
            div("wb-css-action-b", () => handleAction(true)),
            div("wb-css-action-c", () => handleAction(false)),
          );
          root.append(row);
          if (failed) root.append(div("wb-css-error"));
        } else if (step === "confirm") {
          root.append(
            div("wb-css-confirm", () => {
              step = "done";
              render();
            }),
          );
        } else {
          root.append(div("wb-css-success"));
        }
      }

      render();
    </script>
  </body>
</html>
