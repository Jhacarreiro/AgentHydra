<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Addresses</title>
<style>
  body { font-family: system-ui, sans-serif; color: #111; margin: 0; }
  main { max-width: 640px; margin: 0 auto; padding: 24px; }
  header a { font-size: 13px; color: #666; }
  h1 { font-size: 20px; font-weight: 700; margin: 8px 0 0; }
  .container { display: flex; flex-direction: column; gap: 16px; padding: 24px 0; }
  .toast { background: #111; color: #fff; border-radius: 8px; padding: 10px 14px; font-size: 14px; margin: 0; text-align: center; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 4px; border-bottom: 1px solid #e5e5e5; font-size: 14px; }
  .address { display: flex; gap: 8px; }
  .delete { border: 1px solid #c00; color: #c00; background: #fff; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .form { display: flex; flex-direction: column; gap: 8px; }
  input { border: 1px solid #ccc; border-radius: 8px; padding: 10px 12px; font-size: 15px; }
  .add { background: #111; color: #fff; border: none; border-radius: 8px; padding: 12px 16px; font-size: 15px; font-weight: 600; cursor: pointer; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <a href="/">&larr; All pages</a>
    <h1>Saved Addresses</h1>
  </header>
  <div class="container">
    <p class="toast" id="toast" data-testid="toast" hidden></p>
    <ul id="addresses" data-testid="address-list"></ul>
    <div class="form">
      <input id="label" data-testid="label-input" placeholder="Label (e.g. Cabin)">
      <input id="line" data-testid="line-input" placeholder="Street address">
      <button type="button" class="add" id="add" data-testid="add-button">Add address</button>
    </div>
  </div>
</main>
<script>
  const addresses = [
    { id: "home", label: "Home", line: "12 Rosewood Lane, Portland" },
    { id: "office", label: "Office", line: "400 Market Street, Portland" },
  ];
  const labelInput = document.getElementById("label");
  const lineInput = document.getElementById("line");

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.hidden = false;
  }

  function render() {
    document.getElementById("addresses").replaceChildren(
      ...addresses.map((address) => {
        const row = document.createElement("li");
        row.dataset.testid = `address-${address.id}`;
        const text = document.createElement("span");
        text.className = "address";
        const label = document.createElement("strong");
        label.textContent = address.label;
        text.append(label, ` ${address.line}`);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "delete";
        remove.dataset.testid = `delete-${address.id}`;
        remove.textContent = "Delete";
        remove.addEventListener("click", deleteAddress);
        row.append(text, remove);
        return row;
      }),
    );
  }

  /** Appends a new address from the form fields and clears the form. */
  function addAddress() {
    const label = labelInput.value.trim();
    const line = lineInput.value.trim();
    if (!label || !line) return;
    addresses.push({ id: `custom-${addresses.length}`, label, line });
    labelInput.value = "";
    lineInput.value = "";
    showToast("Address saved");
    render();
  }

  /**
   * Handles the delete button.
   * PLANTED BUG (do not fix): the confirmation toast fires but the address is
   * never removed from the list, no matter how many times delete is clicked.
   */
  function deleteAddress() {
    showToast("Address deleted");
  }

  document.getElementById("add").addEventListener("click", addAddress);
  render();
</script>
</body>
</html>
