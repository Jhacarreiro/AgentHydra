<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/NativeDialogs.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      .btn {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
        text-align: center;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <p class="hint">Place the order, confirm the dialog, enter gift code GIFT-7 when prompted.</p>
      <p class="error" id="error" hidden></p>
      <button type="button" class="btn" id="place">Place order</button>
    </main>
    <script>
      // The order runs through a chain of native browser dialogs (confirm, prompt, alert). They live
      // outside the DOM, so a DOM-only driver sees nothing; they must be answered at the browser level.
      const GIFT_CODE = "GIFT-7";
      const errorLine = document.getElementById("error");

      function fail(message) {
        errorLine.textContent = message;
        errorLine.hidden = false;
      }

      document.getElementById("place").addEventListener("click", () => {
        if (!window.confirm("Place this order?")) {
          fail("Order was cancelled");
          return;
        }
        const code = window.prompt("Enter your gift code");
        if (code === null || code.trim() !== GIFT_CODE) {
          fail("Invalid gift code");
          return;
        }
        window.alert("Order placed. Thank you!");
        const done = document.createElement("p");
        done.className = "success";
        done.textContent = `Order placed with code ${GIFT_CODE}`;
        document.getElementById("app").replaceChildren(done);
      });
    </script>
  </body>
</html>
