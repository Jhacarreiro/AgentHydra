<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/DeferredDialog.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Report</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      .btn {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
        text-align: center;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <p class="hint">Submit the report; a confirmation dialog appears shortly after the click. Accept it.</p>
      <p class="error" id="error" hidden>Submission was cancelled</p>
      <p class="hint" id="pending" hidden>Preparing confirmation…</p>
      <button type="button" class="btn" id="submit">Submit report</button>
    </main>
    <script>
      // The confirm opens on a timer, not inside the click handler, so the click has settled before
      // any dialog exists. A driver that only watches for dialogs during the click misses it. A second
      // click while one confirmation is pending is ignored, so one interaction never queues two dialogs.
      const DIALOG_DELAY_MS = 900;
      const errorLine = document.getElementById("error");
      const pendingLine = document.getElementById("pending");
      let pending = false;

      document.getElementById("submit").addEventListener("click", () => {
        if (pending) return;
        pending = true;
        errorLine.hidden = true;
        pendingLine.hidden = false;
        setTimeout(() => {
          const confirmed = window.confirm("Really submit the report?");
          pending = false;
          pendingLine.hidden = true;
          if (!confirmed) {
            errorLine.hidden = false;
            return;
          }
          const done = document.createElement("p");
          done.className = "success";
          done.textContent = "Report submitted after deferred confirmation";
          document.getElementById("app").replaceChildren(done);
        }, DIALOG_DELAY_MS);
      });
    </script>
  </body>
</html>
