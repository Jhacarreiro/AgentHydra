<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login Form</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        color: #111;
      }
      main {
        max-width: 420px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      input {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 16px;
      }
      button {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0 0 16px;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="form-view" style="display: contents">
        <p class="hint">Use tester@tester.army / benchmark123</p>
        <input id="email" placeholder="Email" type="email" autocapitalize="none" />
        <input id="password" placeholder="Password" type="password" />
        <p id="error" class="error" hidden></p>
        <button type="button" id="login">Log in</button>
      </section>
      <section id="done-view" hidden>
        <p class="success">Logged in successfully</p>
        <button type="button" id="logout" style="width: 100%">Log out</button>
      </section>
    </main>
    <script>
      const VALID_EMAIL = "tester@tester.army";
      const VALID_PASSWORD = "benchmark123";
      const email = document.getElementById("email");
      const password = document.getElementById("password");
      const error = document.getElementById("error");
      const formView = document.getElementById("form-view");
      const doneView = document.getElementById("done-view");

      function showError(message) {
        error.textContent = message;
        error.hidden = false;
      }

      document.getElementById("login").addEventListener("click", () => {
        if (!email.value.includes("@")) return showError("Enter a valid email address");
        if (password.value.length < 8) return showError("Password must be at least 8 characters");
        if (email.value !== VALID_EMAIL || password.value !== VALID_PASSWORD) {
          return showError("Invalid credentials");
        }
        error.hidden = true;
        formView.hidden = true;
        doneView.hidden = false;
      });

      document.getElementById("logout").addEventListener("click", () => {
        email.value = "";
        password.value = "";
        doneView.hidden = true;
        formView.hidden = false;
      });
    </script>
  </body>
</html>
