<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/InfiniteScroll.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Feed</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      .feed {
        height: 480px;
        overflow: auto;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid #f0f0f0;
      }
      .text {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .title {
        font-size: 15px;
        font-weight: 600;
      }
      .subtitle {
        font-size: 13px;
        color: #666;
      }
      .loading {
        padding: 16px;
        text-align: center;
        font-size: 14px;
        color: #666;
      }
      .btn {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="hint">Scroll until you find the Golden Ticket, then claim it.</p>
      <p class="success" id="success" hidden>Golden Ticket claimed</p>
      <div class="feed" id="feed"></div>
    </main>
    <script>
      // The feed is its own scroll container (the page itself does not scroll) and holds 20 rows at a
      // time; scrolling within 200 px of its bottom loads the next 20 after LOAD_DELAY_MS. The target
      // is row 138 of 200, seven loads deep, and does not exist in the DOM until its page loads.
      const PAGE_SIZE = 20;
      const TARGET_INDEX = 137;
      const LOAD_DELAY_MS = 400;
      const TOTAL_ITEMS = 200;

      const feed = document.getElementById("feed");
      let loadedPages = 0;
      let loading = null;

      function appendPage() {
        const start = loadedPages * PAGE_SIZE;
        const end = Math.min(start + PAGE_SIZE, TOTAL_ITEMS);
        for (let index = start; index < end; index += 1) {
          const row = document.createElement("div");
          row.className = "row";
          const text = document.createElement("div");
          text.className = "text";
          const title = document.createElement("span");
          title.className = "title";
          title.textContent = index === TARGET_INDEX ? "Golden Ticket" : `Item ${index + 1}`;
          const subtitle = document.createElement("span");
          subtitle.className = "subtitle";
          subtitle.textContent = `Feed entry ${index + 1} of ${TOTAL_ITEMS}`;
          text.append(title, subtitle);
          row.append(text);
          if (index === TARGET_INDEX) {
            const claim = document.createElement("button");
            claim.type = "button";
            claim.className = "btn";
            claim.textContent = "Claim";
            claim.addEventListener("click", () => {
              document.getElementById("success").hidden = false;
            });
            row.append(claim);
          }
          feed.append(row);
        }
        loadedPages += 1;
      }

      feed.addEventListener("scroll", () => {
        if (feed.scrollTop + feed.clientHeight < feed.scrollHeight - 200) return;
        if (loading || loadedPages * PAGE_SIZE >= TOTAL_ITEMS) return;
        loading = document.createElement("div");
        loading.className = "loading";
        loading.textContent = "Loading more…";
        feed.append(loading);
        setTimeout(() => {
          loading.remove();
          loading = null;
          appendPage();
        }, LOAD_DELAY_MS);
      });

      appendPage();
    </script>
  </body>
</html>
