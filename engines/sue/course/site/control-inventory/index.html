<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/ControlInventory.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Control Inventory</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 640px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        line-height: 1.5;
      }
      .ok {
        font-size: 18px;
        font-weight: 700;
        color: #0a7a2f;
        margin: 0;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
        padding: 12px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        font-size: 13px;
      }
      dt {
        color: #666;
      }
      dd {
        margin: 0;
      }
      section {
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 12px;
        margin: 12px 0;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      label,
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 4px 0;
      }
      fieldset {
        border: 1px solid #ddd;
        border-radius: 6px;
        margin: 8px 0;
      }
      button {
        padding: 6px 12px;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li {
        position: relative;
        padding: 4px 0;
      }
      .fname {
        cursor: default;
        user-select: none;
      }
      [role="menu"] {
        display: inline-flex;
        gap: 4px;
        margin-left: 12px;
        padding: 4px;
        border: 1px solid #ccc;
        background: #fff;
      }
      #footnote {
        margin-top: 150vh;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script>
      (() => {
        const FILES0 = ["quarterly-report.pdf", "report.pdf", "notes.txt"];
        const s = {
          agreed: false,
          size: null,
          delivery: null,
          hold: "none",
          longPressed: false,
          dbl: "none",
          dblDone: false,
          files: FILES0.slice(),
          menuFor: null,
          fileState: "no menu open",
          attachments: [],
          view: location.search.includes("view=details") ? "details" : "inventory",
          openedDetails: false,
          returned: false,
          footInView: false,
          footSeen: false,
        };
        let heldAt = 0,
          observer = null;
        const app = document.getElementById("app");
        const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

        function done() {
          return (
            s.agreed &&
            s.size === "Medium" &&
            s.delivery === "Express" &&
            s.longPressed &&
            s.dblDone &&
            s.files.includes("summary.pdf") &&
            !s.files.includes("report.pdf") &&
            s.attachments.length > 0 &&
            s.returned &&
            s.footSeen
          );
        }

        function status() {
          const nav = s.view === "details" ? "on details" : s.returned ? "back on the inventory" : "not opened";
          const rows = [
            ["Toggles", "Toggles state", `${s.agreed ? "terms agreed" : "terms not agreed"}, size ${s.size || "unset"}`],
            ["Delivery", "Delivery state", s.delivery || "unset"],
            ["Hold", "Hold state", s.hold],
            ["Double-click", "Double-click state", s.dbl],
            ["File", "File state", s.fileState],
            ["Attachments", "Attachments state", s.attachments.length ? s.attachments.join(", ") : "none"],
            ["Navigation", "Navigation state", nav],
            ["Scroll", "Footnote state", s.footInView ? "in view" : "out of view"],
          ];
          return `<dl aria-label="Exercise states">${rows
            .map(([t, l, v]) => `<dt>${t}</dt><dd><output aria-label="${l}">${esc(v)}</output></dd>`)
            .join("")}</dl>`;
        }

        function render() {
          let h = done() ? `<p class="ok" data-testid="success-message">All exercises done</p>` : "";
          h += `<p class="hint">Plain controls, one exercise each. Agree to the terms and pick the Medium size; pick Express delivery; hold the Hold me button, then double-click the Double-click me button; rename report.pdf to summary.pdf through its context menu, which opens on right-click only; attach a file; open the details and return with the browser history; bring the footnote at the bottom into view.</p>`;
          h += status();
          if (s.view === "details") {
            h += `<section aria-label="Details"><h2>Details</h2><p>The inventory is one history entry back. This view has no link of its own.</p></section>`;
          } else {
            h += `<section aria-label="Toggles"><h2>Toggles</h2>
        <label><input type="checkbox" id="terms" ${s.agreed ? "checked" : ""}> Agree to terms</label>
        <fieldset><legend>Size</legend>${["Small", "Medium", "Large"]
          .map((o) => `<label><input type="radio" name="size" value="${o}" ${s.size === o ? "checked" : ""}> ${o}</label>`)
          .join("")}</fieldset>
        ${
          s.delivery === null
            ? `<fieldset><legend>Delivery</legend>${["Standard", "Express"]
                .map((o) => `<label><input type="radio" name="delivery" value="${o}"> ${o}</label>`)
                .join("")}</fieldset>`
            : `<div class="row"><span>${s.delivery} delivery selected</span><button type="button" id="chg">Change delivery</button></div>`
        }
      </section>
      <section aria-label="Gestures"><h2>Gestures</h2><div class="row">
        <button type="button" id="hold">Hold me</button>
        <button type="button" id="dbl">Double-click me</button></div></section>
      <section aria-label="Files"><h2>Files</h2><ul>${s.files
        .map(
          (f) =>
            `<li><span class="fname" data-file="${esc(f)}">${esc(f)}</span>${
              s.menuFor === f
                ? `<div role="menu" aria-label="${esc(f)} actions">${["Rename", "Duplicate", "Delete"]
                    .map((a) => `<button type="button" role="menuitem" data-action="${a}">${a}</button>`)
                    .join("")}</div>`
                : ""
            }</li>`,
        )
        .join("")}</ul>
        <label>Attachments <input type="file" id="att" multiple></label></section>
      <section aria-label="Navigation"><h2>Navigation</h2><button type="button" id="open">Open details</button></section>
      <p id="footnote">Footnote</p>`;
          }
          app.innerHTML = h;
          wire();
        }

        function wire() {
          if (observer) {
            observer.disconnect();
            observer = null;
          }
          if (s.view === "details") return;
          const $ = (id) => document.getElementById(id);
          $("terms").onchange = (e) => {
            s.agreed = e.target.checked;
            render();
          };
          app.querySelectorAll("input[name=size]").forEach(
            (r) =>
              (r.onchange = () => {
                s.size = r.value;
                render();
              }),
          );
          app.querySelectorAll("input[name=delivery]").forEach(
            (r) =>
              (r.onchange = () => {
                s.delivery = r.value;
                render();
              }),
          );
          if ($("chg"))
            $("chg").onclick = () => {
              s.delivery = null;
              render();
            };
          $("hold").onpointerdown = () => {
            heldAt = performance.now();
          };
          $("hold").onpointerup = () => {
            if (performance.now() - heldAt >= 500) {
              s.hold = "long-pressed";
              s.longPressed = true;
            } else s.hold = "tapped";
            render();
          };
          $("dbl").onclick = () => {
            s.dbl = "clicked once";
            render();
          };
          $("dbl").ondblclick = () => {
            s.dbl = "double-clicked";
            s.dblDone = true;
            render();
          };
          app.querySelectorAll(".fname").forEach((el) => {
            const f = el.dataset.file;
            el.onclick = () => {
              s.fileState = "a click selects nothing; the menu opens on right-click";
              render();
            };
            el.oncontextmenu = (e) => {
              e.preventDefault();
              s.menuFor = f;
              s.fileState = `menu open for ${f}`;
              render();
            };
          });
          app.querySelectorAll("[role=menuitem]").forEach(
            (b) =>
              (b.onclick = () => {
                const f = s.menuFor,
                  a = b.dataset.action;
                s.menuFor = null;
                if (a !== "Rename") s.fileState = "that is not the action";
                else if (f !== "report.pdf") s.fileState = "that is not the file";
                else {
                  s.files = s.files.map((x) => (x === f ? "summary.pdf" : x));
                  s.fileState = "report.pdf renamed to summary.pdf";
                }
                render();
              }),
          );
          $("att").onchange = (e) => {
            s.attachments = Array.from(e.target.files || [], (f) => f.name);
            render();
          };
          $("open").onclick = () => {
            s.openedDetails = true;
            history.pushState({}, "", "?view=details");
            s.view = "details";
            render();
          };
          observer = new IntersectionObserver((entries) => {
            const vis = entries[0] && entries[0].isIntersecting;
            if (vis === s.footInView && (!vis || s.footSeen)) return;
            s.footInView = !!vis;
            if (vis) s.footSeen = true;
            render();
          });
          observer.observe($("footnote"));
        }

        addEventListener("popstate", () => {
          s.view = location.search.includes("view=details") ? "details" : "inventory";
          if (s.view === "inventory" && s.openedDetails) s.returned = true;
          if (s.view === "details") s.footInView = false;
          render();
        });
        render();
      })();
    </script>
  </body>
</html>
