<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/StaleDom.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slots</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      .progress {
        font-size: 15px;
        font-weight: 600;
        text-align: center;
        margin: 0;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 12px;
        border: 1px solid #f0f0f0;
        border-radius: 8px;
      }
      .label {
        font-size: 14px;
        color: #444;
      }
      .btn {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
        text-align: center;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="hint">Click Tap me 3 times; the list rebuilds itself every second.</p>
      <p class="progress" id="progress"></p>
      <p class="error" id="error" hidden>That was a decoy - progress reset</p>
      <div class="list" id="list"></div>
      <p class="success" id="success" hidden></p>
    </main>
    <script>
      // Every GENERATION_MS every row is thrown away and rebuilt from fresh nodes, with the order
      // rotated one slot. A handle captured before a tick points at a detached node and the target
      // keeps moving, so it must be found again before each click. A decoy click resets progress.
      const GENERATION_MS = 1000;
      const REQUIRED_CLICKS = 3;
      const ROW_COUNT = 6;
      const TARGET_ROW = 2;
      let generation = 0;
      let progress = 0;

      const list = document.getElementById("list");
      const progressLine = document.getElementById("progress");
      const errorLine = document.getElementById("error");
      const successLine = document.getElementById("success");

      function rowClick(row) {
        if (row === TARGET_ROW) {
          errorLine.hidden = true;
          progress = Math.min(progress + 1, REQUIRED_CLICKS);
        } else {
          errorLine.hidden = false;
          progress = 0;
        }
        render();
      }

      function render() {
        progressLine.textContent = `Progress: ${progress} / ${REQUIRED_CLICKS}`;
        if (progress >= REQUIRED_CLICKS) {
          clearInterval(ticker);
          list.remove();
          successLine.textContent = `Target clicked ${REQUIRED_CLICKS} times`;
          successLine.hidden = false;
          return;
        }
        const rows = [];
        for (let position = 0; position < ROW_COUNT; position += 1) {
          const row = (position + generation) % ROW_COUNT;
          const item = document.createElement("div");
          item.className = "row";
          const label = document.createElement("span");
          label.className = "label";
          label.textContent = `Slot ${position + 1}`;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "btn";
          button.textContent = row === TARGET_ROW ? "Tap me" : "Decoy";
          button.addEventListener("click", () => rowClick(row));
          item.append(label, button);
          rows.push(item);
        }
        list.replaceChildren(...rows);
      }

      const ticker = setInterval(() => {
        generation += 1;
        render();
      }, GENERATION_MS);
      render();
    </script>
  </body>
</html>
