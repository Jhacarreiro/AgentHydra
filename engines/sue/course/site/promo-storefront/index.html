<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/PromoStorefront.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Promo Storefront</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 12px 110px;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #111;
        color: #fff;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 14px;
      }
      header span {
        font-size: 12px;
        color: #ffd400;
      }
      ul {
        list-style: none;
        margin: 16px 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 16px;
      }
      .name {
        font-weight: 600;
        margin: 0 0 4px;
      }
      .price {
        margin: 0;
        font-size: 14px;
      }
      s {
        color: #999;
        font-size: 13px;
      }
      .off {
        background: #ffd400;
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 11px;
        font-weight: 700;
      }
      button {
        cursor: pointer;
      }
      .buy {
        background: #111;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font-weight: 600;
      }
      .done {
        color: #0a0;
        font-weight: 600;
        margin: 0;
      }
      #reviews {
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #reviews p {
        margin: 0;
        font-size: 14px;
      }
      .skel {
        height: 16px;
        border-radius: 4px;
        background: #eee;
      }
      #cookies {
        position: fixed;
        left: 16px;
        right: 16px;
        bottom: 16px;
        z-index: 3;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 12px 16px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        font-size: 13px;
      }
      #cookies button,
      .buy-dark {
        background: #111;
        color: #fff;
        border: 0;
        border-radius: 6px;
        padding: 8px 14px;
      }
      #chat {
        position: fixed;
        right: 16px;
        bottom: 72px;
        z-index: 3;
      }
      #bubble {
        width: 44px;
        height: 44px;
        border-radius: 22px;
        border: 0;
        background: #111;
        font-size: 18px;
      }
      #panel {
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 12px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        gap: 8px;
        font-size: 13px;
      }
      #panel p {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header><strong>SoundShop</strong><span>Summer sale - up to 50% off</span></header>
    <ul data-testid="deal-list" id="deals"></ul>
    <section data-testid="reviews-section" id="reviews">
      <div class="skel"></div>
      <div class="skel"></div>
    </section>

    <div data-testid="cookie-banner" id="cookies">
      <span>We use cookies to improve your experience.</span>
      <button type="button" data-testid="accept-cookies">Accept</button>
    </div>
    <div id="chat">
      <button type="button" id="bubble" data-testid="chat-bubble" aria-label="Open support chat">💬</button>
      <div id="panel" data-testid="chat-panel" hidden>
        <p>Hi! How can we help?</p>
        <button type="button" data-testid="chat-close">Close</button>
      </div>
    </div>

    <script>
      const deals = [
        { id: "headphones", name: "Wireless Headphones", was: 80, now: 40 },
        { id: "speaker", name: "Pocket Speaker", was: 50, now: 35 },
      ];
      const list = document.getElementById("deals");
      for (const d of deals) {
        const li = document.createElement("li");
        li.dataset.testid = "deal-" + d.id;
        const pct = Math.round(((d.was - d.now) / d.was) * 100);
        li.innerHTML =
          '<div><p class="name"></p><p class="price"><s></s> <strong></strong> <span class="off"></span></p></div>' +
          '<button type="button" class="buy">Buy now</button>';
        li.querySelector(".name").textContent = d.name;
        li.querySelector("s").textContent = "$" + d.was.toFixed(2);
        li.querySelector("strong").textContent = "$" + d.now.toFixed(2);
        li.querySelector(".off").textContent = pct + "% OFF";
        const buy = li.querySelector(".buy");
        buy.dataset.testid = "buy-" + d.id;
        buy.addEventListener("click", () => {
          const ok = document.createElement("p");
          ok.className = "done";
          ok.dataset.testid = "success-message";
          ok.textContent = "Order confirmed";
          buy.replaceWith(ok);
        });
        list.appendChild(li);
      }

      setTimeout(() => {
        document.getElementById("reviews").innerHTML =
          "<p><strong>Jonas</strong> ★★★★★ Great bass and the battery lasts all week.</p>" +
          "<p><strong>Amelia</strong> ★★★★ Comfortable fit, pairing was instant.</p>";
      }, 1200);

      document.querySelector("#cookies button").addEventListener("click", () => {
        document.getElementById("cookies").remove();
      });
      const bubble = document.getElementById("bubble"),
        panel = document.getElementById("panel");
      bubble.addEventListener("click", () => {
        bubble.hidden = true;
        panel.hidden = false;
      });
      panel.querySelector("button").addEventListener("click", () => {
        panel.hidden = true;
        bubble.hidden = false;
      });
    </script>
  </body>
</html>
