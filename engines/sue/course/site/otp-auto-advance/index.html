<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/OtpAutoAdvance.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enter your code</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      .otp {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      .otp input {
        border: 1px solid #ccc;
        border-radius: 8px;
        width: 44px;
        height: 52px;
        font-size: 20px;
        text-align: center;
        padding: 0;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
        text-align: center;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <p class="hint">Enter code 493027.</p>
      <div class="otp" id="otp"></div>
      <p class="error" id="error" hidden>Incorrect code</p>
    </main>
    <script>
      // Six one-character boxes that move focus on their own: a typed digit fills the box and jumps
      // to the next, Backspace on an empty box clears and returns to the previous one, a paste spreads
      // across the boxes. Verification runs 300 ms after the last box fills; a wrong code clears every
      // box and puts focus back on the first.
      const OTP_CODE = "493027";
      const LENGTH = 6;
      const errorLine = document.getElementById("error");
      const row = document.getElementById("otp");
      let verifyTimer = null;

      const boxes = Array.from({ length: LENGTH }, () => {
        const input = document.createElement("input");
        input.maxLength = 1;
        input.inputMode = "numeric";
        input.autocomplete = "one-time-code";
        row.append(input);
        return input;
      });

      function digits() {
        return boxes.map((box) => box.value);
      }

      function scheduleVerify() {
        clearTimeout(verifyTimer);
        verifyTimer = setTimeout(() => {
          if (digits().join("") === OTP_CODE) {
            const done = document.createElement("p");
            done.className = "success";
            done.textContent = "Code verified";
            document.getElementById("app").replaceChildren(done);
            return;
          }
          errorLine.hidden = false;
          for (const box of boxes) box.value = "";
          boxes[0].focus();
        }, 300);
      }

      // A full code arms the verify timer; any incomplete state cancels it, so a quick edit after
      // filling every box is never judged against stale input.
      function settle() {
        if (digits().every((digit) => digit !== "")) {
          scheduleVerify();
          return;
        }
        clearTimeout(verifyTimer);
        verifyTimer = null;
      }

      boxes.forEach((box, index) => {
        box.addEventListener("input", () => {
          const digit = box.value.replace(/\D/g, "").slice(-1);
          box.value = digit;
          errorLine.hidden = true;
          settle();
          if (digit && index < LENGTH - 1) boxes[index + 1].focus();
        });
        box.addEventListener("keydown", (event) => {
          if (event.key === "Backspace" && box.value === "" && index > 0) {
            event.preventDefault();
            boxes[index - 1].value = "";
            settle();
            boxes[index - 1].focus();
          }
        });
        box.addEventListener("paste", (event) => {
          event.preventDefault();
          const pasted = (event.clipboardData?.getData("text") || "").replace(/\D/g, "");
          if (!pasted) return;
          let cursor = index;
          for (const char of pasted) {
            if (cursor >= LENGTH) break;
            boxes[cursor].value = char;
            cursor += 1;
          }
          errorLine.hidden = true;
          settle();
          boxes[Math.min(cursor, LENGTH - 1)].focus();
        });
      });
    </script>
  </body>
</html>
