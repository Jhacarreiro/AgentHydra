<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wishlist</title>
<style>
  body { font-family: system-ui, sans-serif; color: #111; margin: 0; }
  main { max-width: 640px; margin: 0 auto; padding: 24px; }
  header a { font-size: 13px; color: #666; }
  h1 { font-size: 20px; font-weight: 700; margin: 8px 0 0; }
  .container { display: flex; flex-direction: column; gap: 16px; padding: 24px 0; }
  nav { display: flex; gap: 8px; }
  nav button { border: 1px solid #ccc; background: #fff; border-radius: 8px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  nav button.active { background: #111; color: #fff; border-color: #111; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid #e5e5e5; font-size: 15px; }
  .price { color: #666; font-size: 13px; margin-left: 6px; }
  .save { border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .save.saved { border-color: #c00; color: #c00; }
  .empty { border: 1px dashed #ccc; border-radius: 8px; padding: 24px; text-align: center; }
  .empty p { margin: 0; }
  .empty .headline { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .empty .hint { font-size: 13px; color: #666; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <a href="/">&larr; All pages</a>
    <h1>Wishlist</h1>
  </header>
  <div class="container">
    <nav>
      <button type="button" id="tab-shop" data-testid="tab-shop" class="active">Shop</button>
      <button type="button" id="tab-wishlist" data-testid="tab-wishlist">Wishlist (0)</button>
    </nav>
    <ul id="shop" data-testid="shop-list"></ul>
    <!-- PLANTED BUG (do not fix): the wishlist tab ignores the saved items.
         The tab badge counts saves correctly, but the list always renders
         the empty state, so saved products are gone when the user looks. -->
    <div class="empty" id="wishlist" data-testid="wishlist-panel" hidden>
      <p class="headline" data-testid="wishlist-empty">No saved items yet.</p>
      <p class="hint">Tap Save on any product to keep it here.</p>
    </div>
  </div>
</main>
<script>
  const PRODUCTS = [
    { id: "planner", name: "Weekly Desk Planner", price: 24 },
    { id: "pen", name: "Brass Fountain Pen", price: 58 },
    { id: "notebook", name: "Dot Grid Notebook", price: 14 },
  ];
  let savedIds = [];
  const shopTab = document.getElementById("tab-shop");
  const wishlistTab = document.getElementById("tab-wishlist");

  /** Toggles whether a product is saved to the wishlist. */
  function toggleSaved(productId) {
    savedIds = savedIds.includes(productId) ? savedIds.filter((id) => id !== productId) : [...savedIds, productId];
    render();
  }

  function render() {
    wishlistTab.textContent = `Wishlist (${savedIds.length})`;
    document.getElementById("shop").replaceChildren(
      ...PRODUCTS.map((product) => {
        const saved = savedIds.includes(product.id);
        const row = document.createElement("li");
        const name = document.createElement("span");
        const price = document.createElement("span");
        price.className = "price";
        price.textContent = `$${product.price.toFixed(2)}`;
        name.append(`${product.name} `, price);
        const button = document.createElement("button");
        button.type = "button";
        button.className = saved ? "save saved" : "save";
        button.dataset.testid = `save-${product.id}`;
        button.textContent = saved ? "♥ Saved" : "♡ Save";
        button.addEventListener("click", () => toggleSaved(product.id));
        row.append(name, button);
        return row;
      }),
    );
  }

  function showTab(tab) {
    shopTab.classList.toggle("active", tab === "shop");
    wishlistTab.classList.toggle("active", tab === "wishlist");
    document.getElementById("shop").hidden = tab !== "shop";
    document.getElementById("wishlist").hidden = tab !== "wishlist";
  }

  shopTab.addEventListener("click", () => showTab("shop"));
  wishlistTab.addEventListener("click", () => showTab("wishlist"));
  render();
</script>
</body>
</html>
