<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/NewTabFlow.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verify your account</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      .btn {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      input {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 16px;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0 0 16px;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <p class="hint">Open the verification tab, read the code there, come back and enter it.</p>
      <button type="button" class="btn" id="open">Open verification tab</button>
      <input id="code" placeholder="Verification code" autocapitalize="none" autocomplete="off" />
      <p class="error" id="error" hidden>Wrong verification code</p>
      <button type="button" class="btn" id="verify">Verify</button>
    </main>
    <script>
      // The code exists only on the second page (verify.html, same folder), opened in a new tab:
      // the visitor must switch tabs, read it, and come back here to enter it. The code is checked
      // as a digest so it is not readable from this page's source either.
      const CODE_DIGEST = "1c114d14";

      function digest(text) {
        let hash = 0x811c9dc5;
        for (const char of text) {
          hash ^= char.charCodeAt(0);
          hash = Math.imul(hash, 0x01000193) >>> 0;
        }
        return hash.toString(16).padStart(8, "0");
      }

      // The folder this page is served from, whether the URL ends in /, /index.html or the bare slug.
      function folderPath() {
        let path = location.pathname;
        if (path.endsWith("/index.html")) path = path.slice(0, -"index.html".length);
        if (!path.endsWith("/")) path += "/";
        return path;
      }

      document.getElementById("open").addEventListener("click", () => {
        window.open(folderPath() + "verify.html", "_blank");
      });

      document.getElementById("verify").addEventListener("click", () => {
        const entered = document.getElementById("code").value.trim().toUpperCase();
        if (digest(entered) === CODE_DIGEST) {
          const done = document.createElement("p");
          done.className = "success";
          done.textContent = "Verified successfully";
          document.getElementById("app").replaceChildren(done);
          return;
        }
        document.getElementById("error").hidden = false;
      });
    </script>
  </body>
</html>
