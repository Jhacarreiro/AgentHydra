<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/FileRoundTrip.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>File Round Trip</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 40px auto;
        padding: 0 16px;
      }
      main {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint,
      .muted {
        font-size: 13px;
        color: #666;
        margin: 0;
      }
      button {
        background: #111;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      input[type="file"] {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 16px;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
      }
      .ok {
        color: #0a0;
        font-size: 20px;
        font-weight: 600;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>File Round Trip</h1>
    <main id="app">
      <p class="hint">Download the voucher file, then upload the same file back to verify it.</p>
      <button type="button" data-testid="download-button" id="dl">Download voucher</button>
      <p class="muted" data-testid="download-status" id="status" hidden>Voucher downloaded</p>
      <label class="muted" for="up">Upload voucher file</label>
      <input type="file" id="up" accept=".txt" data-testid="upload-input" />
      <p class="muted" id="picked">No file selected</p>
      <p class="error" data-testid="error-message" id="err" hidden></p>
    </main>
    <script>
      const CODE = "VOUCHER:WEB-5521";
      const $ = (id) => document.getElementById(id);
      $("dl").addEventListener("click", () => {
        const href = URL.createObjectURL(new Blob([CODE], { type: "text/plain" }));
        const a = document.createElement("a");
        a.href = href;
        a.download = "voucher.txt";
        document.body.append(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(href), 1000);
        $("status").hidden = false;
      });
      $("up").addEventListener("change", async (e) => {
        const f = e.target.files && e.target.files[0];
        if (!f) return;
        $("picked").textContent = "Selected file: " + f.name;
        const text = (await f.text()).trim();
        if (text === CODE) {
          $("app").innerHTML = '<p class="ok" data-testid="success-message">Voucher verified</p>';
        } else {
          $("err").textContent = "That is not the voucher we issued";
          $("err").hidden = false;
          e.target.value = "";
        }
      });
    </script>
  </body>
</html>
