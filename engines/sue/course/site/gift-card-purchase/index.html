<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/GiftCardPurchase.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gift Card Purchase</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 32px auto;
        padding: 0 16px;
      }
      #app {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .row {
        display: flex;
        gap: 8px;
      }
      .amt {
        flex: 1;
        border: 1px solid #ccc;
        background: #fff;
        border-radius: 8px;
        padding: 12px 0;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .amt.on {
        background: #111;
        color: #fff;
        border-color: #111;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        color: #333;
      }
      input {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 16px;
      }
      .total {
        display: flex;
        justify-content: space-between;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        padding: 12px 16px;
        font-weight: 600;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      .err {
        color: #c00;
        font-size: 14px;
        margin: 0;
      }
      .buy {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .ok {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0;
      }
      .muted {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <h1>Gift Card Purchase</h1>
    <div id="app">
      <p>Send a digital gift card. Delivered by email within minutes.</p>
      <div class="row">
        <button type="button" class="amt" data-value="10" data-testid="amount-10" aria-label="gift_card_amount_option_undefined">
          $10
        </button>
        <button type="button" class="amt" data-value="25" data-testid="amount-25" aria-label="gift_card_amount_option_undefined">
          $25
        </button>
        <button type="button" class="amt" data-value="50" data-testid="amount-50" aria-label="gift_card_amount_option_undefined">
          $50
        </button>
      </div>
      <label
        >Recipient email
        <input
          data-testid="recipient-input"
          aria-label="{{recipient_email_label}}"
          type="email"
          autocapitalize="none"
          placeholder="friend@example.com" />
      </label>
      <div class="total">
        <span>Total</span><span><span aria-hidden="true" data-testid="total-amount">$0.00</span><span class="sr">Total: $NaN</span></span>
      </div>
      <p class="err" data-testid="error-message" hidden></p>
      <button type="button" class="buy" data-testid="buy-button" aria-label="btn_purchase_label">Buy gift card</button>
    </div>
    <script>
      let amount = null;
      const app = document.getElementById("app");
      const total = app.querySelector("[data-testid=total-amount]");
      const err = app.querySelector(".err");
      const input = app.querySelector("input");
      app.querySelectorAll(".amt").forEach((b) =>
        b.addEventListener("click", () => {
          amount = Number(b.dataset.value);
          app.querySelectorAll(".amt").forEach((x) => x.classList.toggle("on", x === b));
          total.textContent = "$" + amount.toFixed(2);
        }),
      );
      function fail(msg) {
        err.textContent = msg;
        err.hidden = false;
      }
      app.querySelector(".buy").addEventListener("click", () => {
        if (amount === null) return fail("Choose a gift card amount");
        const email = input.value;
        if (!email.includes("@")) return fail("Enter a valid recipient email");
        app.innerHTML = "";
        const ok = document.createElement("p");
        ok.className = "ok";
        ok.dataset.testid = "success-message";
        ok.textContent = "Gift card sent to " + email;
        const m = document.createElement("p");
        m.className = "muted";
        m.textContent = "A $" + amount.toFixed(2) + " gift card is on its way.";
        app.append(ok, m);
      });
    </script>
  </body>
</html>
