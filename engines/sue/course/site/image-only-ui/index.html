<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Image Only UI</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
      }
      .a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 24px 0;
        min-height: 220px;
      }
      .b {
        width: 320px;
        height: 24px;
      }
      .c {
        width: 380px;
        height: 28px;
      }
      .d {
        display: flex;
        gap: 16px;
      }
      .e {
        width: 88px;
        height: 88px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #ccc;
        border-radius: 8px;
        cursor: default;
        user-select: none;
      }
      .f {
        display: flex;
        gap: 8px;
      }
      .g {
        width: 10px;
        height: 10px;
        border-radius: 5px;
        background: #ddd;
      }
      .g.h {
        background: #111;
      }
    </style>
  </head>
  <body>
    <div class="a"></div>
    <script>
      // Every line of text on this page is a runtime-rendered PNG with an empty
      // alt, and the buttons are unlabeled inline SVG icons in bare divs. The DOM
      // carries no readable text, so text extraction and a11y snapshots are
      // useless; only the pixels say what to do.
      const SEQUENCE = ["star", "heart"];
      const PATHS = {
        star: "M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2l-6.1 3.4 1.4-6.8L2.2 9.1l6.9-.8L12 2z",
        heart:
          "M12 21s-7.5-4.8-10-9.3C.4 8.6 2.3 5 5.7 5c2 0 3.4 1.1 4.3 2.5h4C14.9 6.1 16.3 5 18.3 5c3.4 0 5.3 3.6 3.7 6.7C19.5 16.2 12 21 12 21z",
        bolt: "M13 2L4 14h6l-1 8 9-12h-6l1-8z",
      };
      const ICON_ORDER = ["bolt", "star", "heart"];
      const SVG_NS = "http://www.w3.org/2000/svg";
      const root = document.querySelector(".a");
      let progress = 0;
      let failed = false;

      // Paints one line of text into an offscreen canvas and returns it as a PNG
      // data URL, keeping the words themselves out of the DOM.
      function textImage(text, color) {
        const canvas = document.createElement("canvas");
        canvas.width = 640;
        canvas.height = 48;
        const context = canvas.getContext("2d");
        context.font = '600 22px -apple-system, "Segoe UI", sans-serif';
        context.fillStyle = color;
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.fillText(text, 320, 24);
        return canvas.toDataURL("image/png");
      }

      const images = {
        instruction: textImage("Click the star, then the heart", "#111"),
        error: textImage("Wrong icon, start over", "#c00"),
        success: textImage("Icons verified", "#0a0"),
      };

      function img(src, className) {
        const node = document.createElement("img");
        node.src = src;
        node.alt = "";
        node.className = className;
        return node;
      }

      function icon(name) {
        const svg = document.createElementNS(SVG_NS, "svg");
        svg.setAttribute("width", "48");
        svg.setAttribute("height", "48");
        svg.setAttribute("viewBox", "0 0 24 24");
        svg.setAttribute("aria-hidden", "true");
        svg.setAttribute("focusable", "false");
        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("d", PATHS[name]);
        path.setAttribute("fill", "#444");
        svg.append(path);
        return svg;
      }

      function handleIcon(name) {
        if (progress >= SEQUENCE.length) return;
        if (name !== SEQUENCE[progress]) {
          failed = true;
          progress = 0;
        } else {
          failed = false;
          progress += 1;
        }
        render();
      }

      function render() {
        root.replaceChildren();
        if (progress >= SEQUENCE.length) {
          root.append(img(images.success, "c"));
          return;
        }
        root.append(img(images.instruction, "b"));
        const row = document.createElement("div");
        row.className = "d";
        for (const name of ICON_ORDER) {
          const tile = document.createElement("div");
          tile.className = "e";
          tile.append(icon(name));
          tile.addEventListener("click", () => handleIcon(name));
          row.append(tile);
        }
        root.append(row);
        if (failed) root.append(img(images.error, "b"));
        const dots = document.createElement("div");
        dots.className = "f";
        SEQUENCE.forEach((_, index) => {
          const dot = document.createElement("div");
          dot.className = index < progress ? "g h" : "g";
          dots.append(dot);
        });
        root.append(dots);
      }

      render();
    </script>
  </body>
</html>
