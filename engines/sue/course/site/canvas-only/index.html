<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/CanvasOnly.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shapes</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      canvas {
        width: 480px;
        max-width: 100%;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- The whole flow is painted: no roles, no text, no test ids, and the canvas is aria-hidden. -->
      <canvas id="stage" width="480" height="360" aria-hidden="true" role="presentation"></canvas>
      <p id="done" class="success" hidden></p>
    </main>
    <script>
      const WIDTH = 480;
      const HEIGHT = 360;
      const SEQUENCE = ["square", "circle", "diamond"];
      const SHAPES = {
        square: { x: 50, y: 170, width: 80, height: 80 },
        circle: { x: 200, y: 170, width: 80, height: 80 },
        diamond: { x: 350, y: 170, width: 80, height: 80 },
      };

      const canvas = document.getElementById("stage");
      const context = canvas.getContext("2d");
      let progress = 0;
      let status = "idle";

      function redraw() {
        context.clearRect(0, 0, WIDTH, HEIGHT);
        context.fillStyle = "#fff";
        context.fillRect(0, 0, WIDTH, HEIGHT);

        context.fillStyle = "#111";
        context.font = "600 18px sans-serif";
        context.textAlign = "center";
        context.fillText("Click: square, then circle, then diamond", WIDTH / 2, 50);

        context.fillStyle = "#444";
        const square = SHAPES.square;
        context.fillRect(square.x, square.y, square.width, square.height);

        const circle = SHAPES.circle;
        context.beginPath();
        context.arc(circle.x + circle.width / 2, circle.y + circle.height / 2, circle.width / 2, 0, Math.PI * 2);
        context.fill();

        const diamond = SHAPES.diamond;
        context.beginPath();
        context.moveTo(diamond.x + diamond.width / 2, diamond.y);
        context.lineTo(diamond.x + diamond.width, diamond.y + diamond.height / 2);
        context.lineTo(diamond.x + diamond.width / 2, diamond.y + diamond.height);
        context.lineTo(diamond.x, diamond.y + diamond.height / 2);
        context.closePath();
        context.fill();

        for (let index = 0; index < SEQUENCE.length; index += 1) {
          context.beginPath();
          context.arc(WIDTH / 2 - 30 + index * 30, 100, 8, 0, Math.PI * 2);
          context.fillStyle = index < progress ? "#0a0" : "#ccc";
          context.fill();
        }

        if (status === "wrong") {
          context.fillStyle = "#c00";
          context.font = "600 16px sans-serif";
          context.fillText("Wrong shape, try again", WIDTH / 2, 320);
        }
        if (status === "done") {
          context.fillStyle = "#0a0";
          context.font = "600 20px sans-serif";
          context.fillText("Sequence complete", WIDTH / 2, 320);
        }
      }

      // Maps the click from CSS pixels to canvas pixels, hit-tests the fixed shape rects,
      // and advances or resets the sequence.
      canvas.addEventListener("click", (event) => {
        if (status === "done") return;
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX - rect.left) * (WIDTH / rect.width);
        const y = (event.clientY - rect.top) * (HEIGHT / rect.height);
        const clicked = Object.keys(SHAPES).find((name) => {
          const shape = SHAPES[name];
          return x >= shape.x && x <= shape.x + shape.width && y >= shape.y && y <= shape.y + shape.height;
        });
        if (!clicked) return;
        if (clicked !== SEQUENCE[progress]) {
          progress = 0;
          status = "wrong";
        } else {
          progress += 1;
          status = progress === SEQUENCE.length ? "done" : "idle";
        }
        redraw();
        if (status === "done") {
          // The only DOM text on the page, and only once the flow is finished, so the course can score it.
          const done = document.getElementById("done");
          done.textContent = "Sequence complete";
          done.hidden = false;
        }
      });

      redraw();
    </script>
  </body>
</html>
