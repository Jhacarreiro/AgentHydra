<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aria Hidden Flow</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        color: #111;
      }
      .a {
        max-width: 420px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .b {
        font-size: 13px;
        color: #666;
        text-align: center;
      }
      .c {
        display: flex;
        gap: 12px;
      }
      .d {
        flex: 1;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 16px;
        text-align: center;
        cursor: default;
        user-select: none;
      }
      .e {
        font-size: 16px;
        font-weight: 600;
      }
      .f {
        font-size: 13px;
        color: #666;
        margin-top: 4px;
      }
      .g {
        font-size: 16px;
        text-align: center;
      }
      .h {
        background: #111;
        color: #fff;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        text-align: center;
        cursor: default;
        user-select: none;
      }
      .i {
        color: #c00;
        font-size: 14px;
        text-align: center;
      }
      .j {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="a" aria-hidden="true"></div>
    <script>
      // The whole flow sits under ONE aria-hidden container of bare divs, so the
      // accessibility tree for this page is empty: no role, label or test id
      // reaches it. Everything stays visible and clickable.
      const PLANS = ["Basic", "Pro", "Max"];
      const TARGET_PLAN = "Pro";
      const PLAN_PRICES = { Basic: "$9", Pro: "$29", Max: "$99" };
      const root = document.querySelector(".a");
      let step = "pick";
      let error = null;

      function div(className, text) {
        const node = document.createElement("div");
        node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function handlePick(plan) {
        if (plan !== TARGET_PLAN) {
          error = "That is not the " + TARGET_PLAN + " plan";
        } else {
          error = null;
          step = "confirm";
        }
        render();
      }

      function render() {
        root.replaceChildren();
        if (step === "pick") {
          root.append(div("b", "Choose the " + TARGET_PLAN + " plan"));
          const row = div("c");
          for (const plan of PLANS) {
            const card = div("d");
            card.append(div("e", plan), div("f", PLAN_PRICES[plan] + "/mo"));
            card.addEventListener("click", () => handlePick(plan));
            row.append(card);
          }
          root.append(row);
          if (error) root.append(div("i", error));
        } else if (step === "confirm") {
          root.append(div("b", "Confirm your selection"));
          root.append(div("g", TARGET_PLAN + " plan - " + PLAN_PRICES[TARGET_PLAN] + "/mo"));
          const confirm = div("h", "Confirm " + TARGET_PLAN + " plan");
          confirm.addEventListener("click", () => {
            step = "done";
            render();
          });
          root.append(confirm);
        } else {
          root.append(div("j", "Plan activated"));
        }
      }

      render();
    </script>
  </body>
</html>
