<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/DatePicker.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book an appointment</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      .anchor {
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .date-input {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 16px;
        cursor: pointer;
        width: 100%;
        box-sizing: border-box;
      }
      .popup {
        position: absolute;
        top: calc(100% + 4px);
        left: 0;
        z-index: 10;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        padding: 12px;
        width: 280px;
      }
      .popup[hidden] {
        display: none;
      }
      .popup-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      .nav {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 4px 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .month {
        font-size: 14px;
        font-weight: 600;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }
      .weekday {
        font-size: 12px;
        color: #666;
        text-align: center;
        padding: 4px 0;
      }
      .day {
        background: transparent;
        color: #111;
        border: none;
        border-radius: 8px;
        padding: 6px 0;
        font-size: 14px;
        cursor: pointer;
      }
      .day:hover {
        background: #f0f0f0;
      }
      .btn {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <p class="hint">Book an appointment for September 17, 2026.</p>
      <div class="anchor">
        <input class="date-input" id="date" placeholder="Select date" readonly />
        <div class="popup" id="popup" hidden>
          <div class="popup-head">
            <button type="button" class="nav" id="prev">‹</button>
            <span class="month" id="month"></span>
            <button type="button" class="nav" id="next">›</button>
          </div>
          <div class="grid" id="grid"></div>
        </div>
      </div>
      <p class="error" id="error" hidden>Pick the exact requested date</p>
      <button type="button" class="btn" id="confirm">Confirm booking</button>
    </main>
    <script>
      // A custom calendar behind a read-only input: nothing can be typed, the popup opens on June 2026
      // and only the month arrows reach the required date. Confirm accepts that exact date only.
      const MONTH_NAMES = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      const WEEKDAYS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
      const REQUIRED = "2026-09-17";
      const REQUIRED_LABEL = "September 17, 2026";

      let shown = { year: 2026, month: 5 };
      let selected = null;

      const input = document.getElementById("date");
      const popup = document.getElementById("popup");
      const monthLabel = document.getElementById("month");
      const grid = document.getElementById("grid");
      const errorLine = document.getElementById("error");

      function iso(year, month, day) {
        return `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      }

      function shift(offset) {
        const total = shown.year * 12 + shown.month + offset;
        shown = { year: Math.floor(total / 12), month: ((total % 12) + 12) % 12 };
        renderCalendar();
      }

      function renderCalendar() {
        monthLabel.textContent = `${MONTH_NAMES[shown.month]} ${shown.year}`;
        const cells = WEEKDAYS.map((name) => {
          const cell = document.createElement("span");
          cell.className = "weekday";
          cell.textContent = name;
          return cell;
        });
        // Monday-first grid: pad the leading blanks before day 1.
        const blanks = (new Date(shown.year, shown.month, 1).getDay() + 6) % 7;
        for (let blank = 0; blank < blanks; blank += 1) cells.push(document.createElement("span"));
        const days = new Date(shown.year, shown.month + 1, 0).getDate();
        for (let day = 1; day <= days; day += 1) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "day";
          button.textContent = String(day);
          button.addEventListener("click", () => {
            selected = iso(shown.year, shown.month, day);
            input.value = selected;
            errorLine.hidden = true;
            popup.hidden = true;
          });
          cells.push(button);
        }
        grid.replaceChildren(...cells);
      }

      input.addEventListener("click", () => {
        popup.hidden = !popup.hidden;
        if (!popup.hidden) renderCalendar();
      });
      document.getElementById("prev").addEventListener("click", () => shift(-1));
      document.getElementById("next").addEventListener("click", () => shift(1));
      document.getElementById("confirm").addEventListener("click", () => {
        if (selected !== REQUIRED) {
          errorLine.hidden = false;
          return;
        }
        const done = document.createElement("p");
        done.className = "success";
        done.textContent = `Appointment booked for ${REQUIRED_LABEL}`;
        document.getElementById("app").replaceChildren(done);
      });
    </script>
  </body>
</html>
