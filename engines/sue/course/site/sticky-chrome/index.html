<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sticky Chrome</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        color: #111;
      }
      main {
        max-width: 520px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      .scroller {
        position: relative;
        height: 480px;
        overflow: auto;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
      }
      .sticky-header {
        position: sticky;
        top: 0;
        height: 64px;
        display: flex;
        align-items: center;
        padding: 0 16px;
        background: #fff;
        border-bottom: 1px solid #e5e5e5;
        font-size: 16px;
        font-weight: 600;
        z-index: 2;
        box-sizing: border-box;
      }
      .sticky-footer {
        position: sticky;
        bottom: 0;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        background: #fff;
        border-top: 1px solid #e5e5e5;
        font-size: 14px;
        font-weight: 600;
        z-index: 2;
        box-sizing: border-box;
      }
      .filler {
        height: 200px;
        padding: 16px;
        box-sizing: border-box;
      }
      .filler-title {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      .filler-text {
        font-size: 14px;
        color: #444;
        line-height: 1.5;
        margin: 0;
      }
      .accept-row {
        display: flex;
        justify-content: center;
        padding: 16px;
      }
      button {
        background: #111;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <p id="success" class="success" hidden>Terms accepted</p>
      <p class="hint">Scroll to the Accept terms button near the bottom and click it once it is clear of the sticky footer.</p>
      <div class="scroller" data-testid="scroll-container">
        <div class="sticky-header">Terms of Service</div>
        <div id="filler"></div>
        <div class="accept-row">
          <button type="button" id="accept">Accept terms</button>
        </div>
        <div class="sticky-footer">Sticky promo footer — always on top</div>
      </div>
    </main>
    <script>
      // An opaque sticky footer covers the bottom 96px of the scroll box and sits
      // above the content, so it takes every click on whatever is under it. The
      // Accept terms button sits below ~2800px of filler; it only takes a click
      // once it has been scrolled clear of the footer.
      const FILLER_BLOCKS = 14;
      const filler = document.getElementById("filler");
      for (let i = 1; i <= FILLER_BLOCKS; i += 1) {
        const block = document.createElement("div");
        block.className = "filler";
        const title = document.createElement("p");
        title.className = "filler-title";
        title.textContent = "Section " + i;
        const text = document.createElement("p");
        text.className = "filler-text";
        text.textContent =
          "These terms describe how the benchmark service is provided. Section " +
          i +
          " repeats the same deterministic paragraph so the page is tall enough that the accept" +
          " button sits far below the fold, behind the sticky promo footer.";
        block.append(title, text);
        filler.append(block);
      }
      filler.replaceWith(...filler.childNodes);

      document.getElementById("accept").addEventListener("click", () => {
        document.getElementById("success").hidden = false;
      });
    </script>
  </body>
</html>
