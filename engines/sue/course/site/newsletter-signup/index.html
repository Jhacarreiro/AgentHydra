<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter Signup</title>
<style>
  body { font-family: system-ui, sans-serif; color: #111; margin: 0; }
  main { max-width: 640px; margin: 0 auto; padding: 24px; }
  header a { font-size: 13px; color: #666; }
  h1 { font-size: 20px; font-weight: 700; margin: 8px 0 0; }
  .container { display: flex; flex-direction: column; gap: 12px; padding: 24px 0; }
  .pitch { font-size: 14px; color: #333; margin: 0; }
  input { border: 1px solid #ccc; border-radius: 8px; padding: 10px 12px; font-size: 16px; }
  button { background: #111; color: #fff; border: none; border-radius: 8px; padding: 12px 16px; font-size: 16px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<main>
  <header>
    <a href="/">&larr; All pages</a>
    <h1>Newsletter Signup</h1>
  </header>
  <div class="container">
    <p class="pitch">Get one email a month with product updates. No spam, ever.</p>
    <input id="email" data-testid="email-input" type="email" autocapitalize="none" placeholder="you@example.com">
    <button type="button" id="subscribe" data-testid="subscribe-button">Subscribe</button>
  </div>
</main>
<script>
  /**
   * Handles the subscribe click.
   * PLANTED BUG (do not fix): the submit handler crashes before any feedback
   * renders - no confirmation, no error message, only a console error. The
   * button looks alive but subscribing is impossible.
   */
  function handleSubscribe() {
    console.error(
      "Uncaught TypeError: Cannot read properties of undefined (reading 'subscribe')",
      "\n    at handleSubscribe (newsletter-signup.js:42:19)",
    );
  }
  document.getElementById("subscribe").addEventListener("click", handleSubscribe);
</script>
</body>
</html>
