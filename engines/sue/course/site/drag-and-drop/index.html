<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/DragAndDrop.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fruit basket</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      .items {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
      .card {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        font-weight: 600;
        background: #fff;
        cursor: grab;
        user-select: none;
      }
      .card.used {
        cursor: default;
        opacity: 0.35;
      }
      .dropzone {
        min-height: 120px;
        border: 2px dashed #ccc;
        border-radius: 8px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px;
      }
      .empty {
        font-size: 14px;
        color: #666;
      }
      .dropped {
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 15px;
        font-weight: 600;
        background: #f4f4f4;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
        text-align: center;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="hint">Drag Banana into the dropzone, then Cherry. Leave Apple alone.</p>
      <div class="items" id="items"></div>
      <div class="dropzone" id="dropzone"></div>
      <p class="error" id="error" hidden></p>
      <p class="success" id="success" hidden>Items dropped in the right order</p>
    </main>
    <script>
      // Real HTML5 drag and drop: the dropzone reads the item name from dataTransfer, so plain clicks
      // do nothing and only genuine dragstart/dragover/drop events move an item. Items must land in
      // REQUIRED_ORDER; Apple or an out-of-order drop empties the dropzone.
      const REQUIRED_ORDER = ["Banana", "Cherry"];
      const ITEMS = ["Apple", "Banana", "Cherry"];
      let dropped = [];
      let done = false;

      const itemsRow = document.getElementById("items");
      const dropzone = document.getElementById("dropzone");
      const errorLine = document.getElementById("error");
      const successLine = document.getElementById("success");

      const cards = ITEMS.map((name) => {
        const card = document.createElement("div");
        card.className = "card";
        card.textContent = name;
        card.addEventListener("dragstart", (event) => {
          event.dataTransfer.setData("text/plain", name);
          event.dataTransfer.effectAllowed = "move";
        });
        itemsRow.append(card);
        return { name, card };
      });

      function render() {
        for (const { name, card } of cards) {
          const used = done || dropped.includes(name);
          card.draggable = !used;
          card.classList.toggle("used", used);
        }
        dropzone.replaceChildren();
        if (dropped.length === 0) {
          const empty = document.createElement("span");
          empty.className = "empty";
          empty.textContent = "Drop items here";
          dropzone.append(empty);
        }
        for (const name of dropped) {
          const chip = document.createElement("span");
          chip.className = "dropped";
          chip.textContent = name;
          dropzone.append(chip);
        }
        successLine.hidden = !done;
      }

      dropzone.addEventListener("dragover", (event) => event.preventDefault());
      dropzone.addEventListener("drop", (event) => {
        event.preventDefault();
        const name = event.dataTransfer.getData("text/plain");
        if (!name || done) return;
        if (name !== REQUIRED_ORDER[dropped.length]) {
          dropped = [];
          errorLine.textContent = "Wrong item order, starting over";
          errorLine.hidden = false;
        } else {
          dropped = [...dropped, name];
          errorLine.hidden = true;
          done = dropped.length === REQUIRED_ORDER.length;
        }
        render();
      });

      render();
    </script>
  </body>
</html>
