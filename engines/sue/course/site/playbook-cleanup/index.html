<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/PlaybookCleanup.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Playbook Cleanup</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        margin-bottom: 16px;
      }
      h2 {
        font-size: 18px;
        margin: 0;
      }
      .sub {
        color: #666;
        font-size: 13px;
        margin: 4px 0 0;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        color: #555;
        font-size: 12px;
      }
      input {
        width: 220px;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 9px 11px;
        font-size: 14px;
      }
      ul {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        min-height: 84px;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 14px;
      }
      h3 {
        font-size: 15px;
        margin: 0;
      }
      .meta {
        color: #777;
        font-size: 12px;
        margin: 6px 0 0;
      }
      .wrap {
        position: relative;
      }
      .more {
        width: 32px;
        height: 28px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
      }
      [role="menu"] {
        position: absolute;
        z-index: 2;
        top: 32px;
        right: 0;
        min-width: 100px;
        border: 1px solid #ddd;
        border-radius: 8px;
        background: #fff;
        padding: 4px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      }
      [role="menuitem"] {
        width: 100%;
        border: 0;
        background: none;
        color: #b42318;
        cursor: pointer;
        padding: 8px 10px;
        text-align: left;
      }
      .empty {
        border: 1px dashed #ccc;
        border-radius: 10px;
        color: #555;
        margin: 0;
        padding: 28px;
        text-align: center;
      }
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: rgba(0, 0, 0, 0.35);
      }
      [role="dialog"] {
        width: min(420px, 100%);
        border-radius: 12px;
        background: #fff;
        padding: 20px;
      }
      .acts {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .acts button {
        border: 1px solid #ccc;
        border-radius: 7px;
        background: #fff;
        cursor: pointer;
        padding: 8px 12px;
      }
      .acts .danger {
        background: #b42318;
        border-color: #b42318;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <div>
        <h2>Playbooks</h2>
        <p class="sub">Reusable review guidance for your team.</p>
      </div>
      <label>Search playbooks <input id="q" type="search" placeholder="Search" /></label>
    </div>
    <div id="out"></div>
    <div id="modal"></div>
    <script>
      const TARGET = "Launch Approval Draft";
      let books = [
        { id: "nda", name: "NDA Review", rules: 8 },
        { id: "launch", name: TARGET, rules: 4 },
        { id: "vendor", name: "Vendor Onboarding", rules: 6 },
      ];
      let open = null,
        pending = null;
      const q = document.getElementById("q"),
        out = document.getElementById("out"),
        modal = document.getElementById("modal");
      const el = (tag, props = {}, ...kids) => {
        const e = document.createElement(tag);
        for (const k in props) {
          if (k.startsWith("on")) e.addEventListener(k.slice(2), props[k]);
          else e.setAttribute(k, props[k]);
        }
        e.append(...kids);
        return e;
      };

      function render() {
        const term = q.value.trim();
        const shown = books.filter((b) => b.name.toLowerCase().includes(term.toLowerCase()));
        out.replaceChildren();
        if (shown.length) {
          const ul = el("ul");
          for (const b of shown) {
            const btn = el(
              "button",
              {
                type: "button",
                class: "more",
                "aria-label": "More actions for " + b.name,
                "aria-haspopup": "menu",
                "aria-expanded": String(open === b.id),
                onclick: () => {
                  open = open === b.id ? null : b.id;
                  render();
                },
              },
              "\u22EF",
            );
            const wrap = el("div", { class: "wrap" }, btn);
            if (open === b.id)
              wrap.append(
                el(
                  "div",
                  { role: "menu", "aria-label": "Actions for " + b.name },
                  el(
                    "button",
                    {
                      type: "button",
                      role: "menuitem",
                      onclick: () => {
                        pending = b;
                        open = null;
                        render();
                      },
                    },
                    "Delete",
                  ),
                ),
              );
            ul.append(
              el(
                "li",
                {},
                el("div", {}, el("h3", {}, b.name), el("p", { class: "meta" }, b.rules + (b.rules === 1 ? " rule" : " rules"))),
                wrap,
              ),
            );
          }
          out.append(ul);
        } else {
          const gone = !books.some((b) => b.name === TARGET) && term.toLowerCase() === TARGET.toLowerCase();
          out.append(
            el("p", { class: "empty", "data-testid": gone ? "success-message" : "empty-state" }, 'No playbooks match "' + term + '".'),
          );
        }
        modal.replaceChildren();
        if (pending) {
          modal.append(
            el(
              "div",
              { class: "overlay" },
              el(
                "section",
                { role: "dialog", "aria-modal": "true", "aria-labelledby": "dlg-title" },
                el("h2", { id: "dlg-title" }, "Remove Playbook"),
                el("p", {}, 'Are you sure you want to remove "' + pending.name + '"?'),
                el(
                  "div",
                  { class: "acts" },
                  el(
                    "button",
                    {
                      type: "button",
                      onclick: () => {
                        pending = null;
                        render();
                      },
                    },
                    "Cancel",
                  ),
                  el(
                    "button",
                    {
                      type: "button",
                      class: "danger",
                      onclick: () => {
                        const id = pending.id;
                        books = books.filter((b) => b.id !== id);
                        pending = null;
                        render();
                      },
                    },
                    "Remove",
                  ),
                ),
              ),
            ),
          );
        }
      }
      q.addEventListener("input", render);
      render();
    </script>
  </body>
</html>
