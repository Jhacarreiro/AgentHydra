<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Div Soup</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "Segoe UI", sans-serif;
        color: #111;
      }
      .a {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 24px 0;
      }
      .b {
        font-size: 13px;
        color: #666;
        text-align: center;
      }
      .c {
        display: flex;
        gap: 12px;
        justify-content: center;
        padding: 8px 0;
      }
      .d {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1px solid #ccc;
        background: #fff;
      }
      .d.e {
        border-color: #111;
        background: #111;
      }
      .f {
        color: #c00;
        font-size: 14px;
        text-align: center;
      }
      .g {
        display: grid;
        grid-template-columns: repeat(3, 72px);
        gap: 12px;
      }
      .h {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 56px;
        background: #111;
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        border-radius: 8px;
        cursor: default;
        user-select: none;
      }
      .i {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="a"></div>
    <script>
      // A PIN pad built from bare divs: no buttons, inputs, roles, aria, tabindex
      // or ids, and the cursor stays "default" over the tiles. The DOM gives no
      // handle on the controls; the visitor reads the screen and taps the tiles.
      const SECRET_CODE = "7291";
      const PAD_TILES = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "‹", "0", "→"];
      const root = document.querySelector(".a");
      let entered = "";
      let wrong = false;
      let granted = false;

      function div(className, text) {
        const node = document.createElement("div");
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function handleTile(tile) {
        if (granted) return;
        if (tile === "‹") {
          entered = entered.slice(0, -1);
          wrong = false;
        } else if (tile === "→") {
          if (entered === SECRET_CODE) {
            wrong = false;
            granted = true;
          } else {
            entered = "";
            wrong = true;
          }
        } else {
          wrong = false;
          if (entered.length < SECRET_CODE.length) entered += tile;
        }
        render();
      }

      function render() {
        root.replaceChildren();
        if (granted) {
          root.append(div("i", "Access granted"));
          return;
        }
        root.append(div("b", "Enter the code " + SECRET_CODE + " and press the arrow"));
        const dots = div("c");
        for (let index = 0; index < SECRET_CODE.length; index += 1) {
          dots.append(div(index < entered.length ? "d e" : "d"));
        }
        root.append(dots);
        if (wrong) root.append(div("f", "Wrong code"));
        const grid = div("g");
        for (const tile of PAD_TILES) {
          const node = div("h", tile);
          node.addEventListener("click", () => handleTile(tile));
          grid.append(node);
        }
        root.append(grid);
      }

      render();
    </script>
  </body>
</html>
