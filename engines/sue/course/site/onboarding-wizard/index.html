<!doctype html>
<!-- Adapted from tester-army/e2e apps/web-benchmark/app/src/Examples/OnboardingWizard.tsx (Apache-2.0, Copyright TesterArmy); re-implemented as plain HTML for the SUE course. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Onboarding</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #111;
        background: #fff;
      }
      main {
        max-width: 520px;
        margin: 0 auto;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .hint {
        font-size: 13px;
        color: #666;
        text-align: center;
        margin: 0;
      }
      .wizard {
        display: flex;
        flex-direction: column;
        gap: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        padding: 16px;
      }
      .progress {
        font-size: 13px;
        font-weight: 700;
        color: #666;
      }
      .brief {
        display: flex;
        flex-direction: column;
        gap: 4px;
        border: 1px solid #e0d5a8;
        border-radius: 8px;
        padding: 12px;
        background: #fdf8e3;
      }
      .brief-title {
        font-size: 13px;
        font-weight: 700;
      }
      .brief-line {
        font-size: 13px;
        color: #333;
      }
      .section {
        font-size: 15px;
        font-weight: 700;
        margin-top: 4px;
      }
      .label {
        font-size: 13px;
        color: #444;
      }
      .input {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 15px;
      }
      .dropdown {
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 15px;
        cursor: pointer;
        background: #fafafa;
      }
      .dropdown-list {
        display: flex;
        flex-direction: column;
        border: 1px solid #ccc;
        border-radius: 6px;
        max-height: 180px;
        overflow: auto;
      }
      .option {
        padding: 6px 10px;
        font-size: 14px;
        cursor: pointer;
      }
      .option:hover {
        background: #f0f0f0;
      }
      .calendar {
        display: flex;
        flex-direction: column;
        gap: 6px;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 8px;
      }
      .calendar-head,
      .calendar-months {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
      }
      .arrow {
        padding: 4px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        user-select: none;
      }
      .calendar-title {
        font-size: 14px;
        font-weight: 600;
      }
      .calendar-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 2px;
      }
      .day {
        text-align: center;
        padding: 4px 0;
        font-size: 13px;
        cursor: pointer;
        border-radius: 4px;
      }
      .day.selected {
        background: #111;
        color: #fff;
      }
      .calendar-value {
        font-size: 12px;
        color: #666;
      }
      .stepper {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stepper-button {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #ccc;
        border-radius: 6px;
        cursor: pointer;
        user-select: none;
      }
      .stepper-value {
        min-width: 24px;
        text-align: center;
        font-weight: 600;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .toggle-label {
        font-size: 14px;
      }
      .toggle {
        min-width: 40px;
        text-align: center;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }
      .toggle.on {
        background: #0a0;
        color: #fff;
      }
      .toggle.off {
        background: #ddd;
        color: #333;
      }
      .plans {
        display: flex;
        gap: 8px;
      }
      .plan {
        flex: 1;
        text-align: center;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
        cursor: pointer;
      }
      .plan.selected {
        border-color: #111;
        background: #111;
        color: #fff;
      }
      .summary {
        display: flex;
        flex-direction: column;
        gap: 4px;
        background: #f6f6f6;
        border-radius: 6px;
        padding: 10px;
      }
      .summary-line {
        font-size: 13px;
      }
      .error {
        color: #c00;
        font-size: 14px;
        margin: 0;
      }
      .nav-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
      }
      .back,
      .next {
        padding: 10px 16px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        user-select: none;
      }
      .back {
        border: 1px solid #ccc;
      }
      .next {
        background: #111;
        color: #fff;
        margin-left: auto;
      }
      .success {
        font-size: 20px;
        font-weight: 600;
        color: #0a0;
        text-align: center;
        margin: 0;
      }
      .success-sub {
        font-size: 15px;
        color: #333;
        text-align: center;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script>
      // A five-step wizard that tests long-horizon recall and long form filling with deliberately poor
      // accessibility. The full brief, including the support PIN the last step asks for, shows only on
      // step 1 (Back rereads it; typed values survive navigation). Inputs have no labels, placeholders
      // or aria wiring; dropdowns, steppers, toggles, the date picker and every button are bare divs
      // with no roles. The calendar opens on June 2026 and must be steered to March 1990 with decade,
      // year and month arrows. One toggle starts wrong and one is a trap that must stay off.
      const MONTH_NAMES = [
        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December",
      ];
      const TARGET_BIRTH = { year: 1990, month: 2, day: 14 };
      const COUNTRIES = ["Austria", "Czechia", "Germany", "Poland", "Portugal", "Slovakia", "Spain", "Sweden"];
      const OCCUPATIONS = ["Accountant", "Data analyst", "Product designer", "Software engineer", "Teacher", "Nurse"];
      const PLANS = ["Solo", "Studio", "Enterprise"];
      const BRIEF_LINES = [
        "Full name: Maria Novak",
        "Email: maria.novak@example.com",
        "Phone: +48 601 222 333",
        "Street: Krucza 12",
        "City: Warsaw",
        "Postal code: 00-585",
        "Country: Poland",
        "Birth date: March 14, 1990",
        "Occupation: Product designer",
        "Experience: 7 years",
        "Notifications: turn on Product updates and Weekly digest, turn off SMS alerts, leave Beta features off",
        "Plan: Studio",
        "Support PIN: 8412",
      ];
      const PREFERENCE_ROWS = [
        { key: "updates", label: "Product updates" },
        { key: "sms", label: "SMS alerts" },
        { key: "digest", label: "Weekly digest" },
        { key: "beta", label: "Beta features" },
      ];
      const TARGET_PREFERENCES = { updates: true, sms: false, digest: true, beta: false };

      const state = {
        step: 1,
        error: null,
        fullName: "",
        email: "",
        phone: "",
        street: "",
        city: "",
        postal: "",
        country: null,
        countryOpen: false,
        calendar: { year: 2026, month: 5 },
        birth: null,
        occupation: null,
        occupationOpen: false,
        experience: 0,
        preferences: { updates: false, sms: true, digest: false, beta: false },
        plan: null,
        pin: "",
        consent: false,
      };

      const app = document.getElementById("app");

      // Collapses runs of whitespace so spacing typos do not fail the exact-match checks.
      const collapse = (value) => value.replace(/\s+/g, " ").trim();
      // Removes all whitespace where grouping spaces are cosmetic.
      const stripSpaces = (value) => value.replace(/\s+/g, "");

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function clickable(className, text, onClick) {
        const node = el("div", className, text);
        node.addEventListener("click", () => {
          onClick();
          render();
        });
        return node;
      }

      function field(label, key) {
        const input = el("input", "input");
        input.value = state[key];
        input.addEventListener("input", () => {
          state[key] = input.value;
        });
        return [el("div", "label", label), input];
      }

      function dropdown(label, valueKey, openKey, options) {
        const nodes = [
          el("div", "label", label),
          clickable("dropdown", state[valueKey] ?? "Choose", () => {
            state[openKey] = !state[openKey];
          }),
        ];
        if (state[openKey]) {
          const list = el("div", "dropdown-list");
          for (const name of options) {
            list.append(
              clickable("option", name, () => {
                state[valueKey] = name;
                state[openKey] = false;
              }),
            );
          }
          nodes.push(list);
        }
        return nodes;
      }

      function shiftCalendar(months, years) {
        const total = state.calendar.year * 12 + state.calendar.month + months + years * 12;
        state.calendar = { year: Math.floor(total / 12), month: ((total % 12) + 12) % 12 };
      }

      function calendar() {
        const { year, month } = state.calendar;
        const box = el("div", "calendar");
        const head = el("div", "calendar-head");
        head.append(
          clickable("arrow", "«", () => shiftCalendar(0, -10)),
          clickable("arrow", "‹", () => shiftCalendar(0, -1)),
          el("div", "calendar-title", `${MONTH_NAMES[month]} ${year}`),
          clickable("arrow", "›", () => shiftCalendar(0, 1)),
          clickable("arrow", "»", () => shiftCalendar(0, 10)),
        );
        const months = el("div", "calendar-months");
        months.append(
          clickable("arrow", "‹ month", () => shiftCalendar(-1, 0)),
          clickable("arrow", "month ›", () => shiftCalendar(1, 0)),
        );
        const grid = el("div", "calendar-grid");
        // Monday-first: leading blanks, then the day numbers.
        const blanks = (new Date(year, month, 1).getDay() + 6) % 7;
        for (let blank = 0; blank < blanks; blank += 1) grid.append(el("div"));
        const days = new Date(year, month + 1, 0).getDate();
        for (let day = 1; day <= days; day += 1) {
          const birth = state.birth;
          const selected = birth && birth.year === year && birth.month === month && birth.day === day;
          grid.append(
            clickable(selected ? "day selected" : "day", String(day), () => {
              state.birth = { year, month, day };
            }),
          );
        }
        const birth = state.birth;
        const value = el(
          "div",
          "calendar-value",
          birth ? `Selected: ${MONTH_NAMES[birth.month]} ${birth.day}, ${birth.year}` : "Nothing selected",
        );
        box.append(head, months, grid, value);
        return box;
      }

      function toggleRow(label, isOn, onToggle) {
        const row = el("div", "toggle-row");
        row.append(el("div", "toggle-label", label), clickable(isOn ? "toggle on" : "toggle off", isOn ? "On" : "Off", onToggle));
        return row;
      }

      // Returns the first field on the current step that does not match the brief, or null.
      function validateStep() {
        if (state.step === 1) {
          if (collapse(state.fullName) !== "Maria Novak") return "Full name does not match the brief";
          if (state.email.trim().toLowerCase() !== "maria.novak@example.com") return "Email does not match the brief";
          if (stripSpaces(state.phone) !== "+48601222333") return "Phone does not match the brief";
          return null;
        }
        if (state.step === 2) {
          if (collapse(state.street) !== "Krucza 12") return "Street does not match the brief";
          if (collapse(state.city) !== "Warsaw") return "City does not match the brief";
          if (stripSpaces(state.postal) !== "00-585") return "Postal code does not match the brief";
          if (state.country !== "Poland") return "Country does not match the brief";
          return null;
        }
        if (state.step === 3) {
          const birth = state.birth;
          if (!birth || birth.year !== TARGET_BIRTH.year || birth.month !== TARGET_BIRTH.month || birth.day !== TARGET_BIRTH.day) {
            return "Birth date does not match the brief";
          }
          if (state.occupation !== "Product designer") return "Occupation does not match the brief";
          if (state.experience !== 7) return "Experience does not match the brief";
          return null;
        }
        if (state.step === 4) {
          const matches = PREFERENCE_ROWS.every(({ key }) => state.preferences[key] === TARGET_PREFERENCES[key]);
          if (!matches) return "Notification toggles do not match the brief";
          if (state.plan !== "Studio") return "Plan does not match the brief";
          return null;
        }
        if (state.pin.trim() !== "8412") return "Support PIN is wrong";
        if (!state.consent) return "Confirm the details first";
        return null;
      }

      function next() {
        const mismatch = validateStep();
        if (mismatch) {
          state.error = mismatch;
          return;
        }
        state.error = null;
        if (state.step === 5) {
          state.done = true;
          return;
        }
        state.step += 1;
      }

      function stepNodes() {
        if (state.step === 1) {
          const brief = el("div", "brief");
          brief.append(el("div", "brief-title", "Onboarding brief - memorize before continuing"));
          for (const line of BRIEF_LINES) brief.append(el("div", "brief-line", line));
          return [
            brief,
            el("div", "section", "Account"),
            ...field("Full name", "fullName"),
            ...field("Email", "email"),
            ...field("Phone", "phone"),
          ];
        }
        if (state.step === 2) {
          return [
            el("div", "section", "Address"),
            ...field("Street", "street"),
            ...field("City", "city"),
            ...field("Postal code", "postal"),
            ...dropdown("Country", "country", "countryOpen", COUNTRIES),
          ];
        }
        if (state.step === 3) {
          const stepper = el("div", "stepper");
          stepper.append(
            clickable("stepper-button", "-", () => {
              state.experience = Math.max(0, state.experience - 1);
            }),
            el("div", "stepper-value", String(state.experience)),
            clickable("stepper-button", "+", () => {
              state.experience += 1;
            }),
          );
          return [
            el("div", "section", "Profile"),
            el("div", "label", "Birth date"),
            calendar(),
            ...dropdown("Occupation", "occupation", "occupationOpen", OCCUPATIONS),
            el("div", "label", "Years of experience"),
            stepper,
          ];
        }
        if (state.step === 4) {
          const rows = PREFERENCE_ROWS.map(({ key, label }) =>
            toggleRow(label, state.preferences[key], () => {
              state.preferences = { ...state.preferences, [key]: !state.preferences[key] };
            }),
          );
          const plans = el("div", "plans");
          for (const name of PLANS) {
            plans.append(
              clickable(state.plan === name ? "plan selected" : "plan", name, () => {
                state.plan = name;
              }),
            );
          }
          return [el("div", "section", "Preferences"), ...rows, el("div", "label", "Plan"), plans];
        }
        const summary = el("div", "summary");
        const birth = state.birth;
        summary.append(
          el("div", "summary-line", `${state.fullName} · ${state.email} · ${state.phone}`),
          el("div", "summary-line", `${state.street}, ${state.postal} ${state.city}, ${state.country ?? "?"}`),
          el(
            "div",
            "summary-line",
            birth
              ? `Born ${MONTH_NAMES[birth.month]} ${birth.day}, ${birth.year} · ${state.occupation ?? "?"} · ${state.experience} years`
              : "No birth date",
          ),
          el("div", "summary-line", `Plan: ${state.plan ?? "?"}`),
        );
        return [
          el("div", "section", "Review"),
          summary,
          ...field("Support PIN from the brief", "pin"),
          toggleRow("I confirm the details are correct", state.consent, () => {
            state.consent = !state.consent;
          }),
        ];
      }

      function render() {
        if (state.done) {
          app.replaceChildren(el("p", "success", "Onboarding complete"), el("p", "success-sub", "Welcome aboard, Maria Novak"));
          return;
        }
        const wizard = el("div", "wizard");
        wizard.append(el("div", "progress", `Step ${state.step} of 5`), ...stepNodes());
        if (state.error) wizard.append(el("p", "error", state.error));
        const navRow = el("div", "nav-row");
        if (state.step > 1) {
          navRow.append(
            clickable("back", "Back", () => {
              state.error = null;
              state.step -= 1;
            }),
          );
        }
        navRow.append(clickable("next", state.step === 5 ? "Finish" : "Next", next));
        wizard.append(navRow);
        app.replaceChildren(
          el(
            "p",
            "hint",
            "Complete every wizard step exactly as the brief on step 1 says. The brief is only visible on step 1; Back preserves what you typed.",
          ),
          wizard,
        );
      }

      render();
    </script>
  </body>
</html>
