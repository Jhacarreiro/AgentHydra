<!doctype html>
<!--
  The host editor's shape on a phone (run 20260922-171336-3009, old-sue): an event list, and over it
  a full-screen editor sheet with a toolbar across its top. The sheet paints the whole screen, so the
  list is out of sight, not dimmed behind something: every look inside the editor used to say
  "[the rest of the page is behind "open_in_new search Save DRAFT ..." - deal with that first]".
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sheet fixture</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.4 system-ui,
          sans-serif;
      }
      .list {
        padding: 80px 24px;
      }
      .sheet {
        position: fixed;
        inset: 0;
        background: #fff;
        z-index: 20;
        display: flex;
        flex-direction: column;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        padding: 8px 16px;
        border-bottom: 1px solid #ddd;
      }
      .fields {
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <main class="list">
      <h1>Host events</h1>
      <button type="button">Open the picnic</button>
      <button type="button">New event</button>
    </main>
    <section class="sheet">
      <div class="toolbar">
        <button type="button">Save</button>
        <button type="button">Publish</button>
      </div>
      <div class="fields">
        <label>Event title <input name="title" /></label>
      </div>
    </section>
  </body>
</html>
