<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Painted pictures</title>
    <style>
      body {
        margin: 0;
        font: 16px sans-serif;
      }
      .box {
        width: 200px;
        height: 200px;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><rect width='16' height='16' fill='teal'/></svg>");
      }
      #speck {
        background-repeat: no-repeat;
        background-size: auto;
      }
      #cover {
        background-repeat: no-repeat;
        background-size: cover;
      }
      #tiled {
        background-repeat: repeat;
      }
      #never {
        background-image: url("data:image/png;base64,AAAA");
      }
      .choice input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
      }
    </style>
  </head>
  <body>
    <p id="question">Which animal is this?</p>
    <label class="choice" id="card">
      <input type="radio" name="animal" value="shark" />
      <img
        id="cardphoto"
        width="200"
        height="200"
        alt="Shark"
        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><rect width='200' height='200' fill='steelblue'/></svg>" />
    </label>
    <div class="box" id="speck"></div>
    <div class="box" id="cover"></div>
    <div class="box" id="tiled"></div>
    <div class="box" id="never"></div>
  </body>
</html>
