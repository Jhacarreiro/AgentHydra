<!doctype html>
<!--
  The shape that made a Sue report a working button as broken (run 20260922-090718-7a5f,
  office-manager): a consent dialog over a full-viewport scrim, with the page's own call to action
  still perfectly visible underneath it. Visibility is unchanged for that button - it is displayed,
  opaque and on screen - so only a hit test can tell that a click on it lands on the scrim.

  The scrim here is full-viewport, so EVERY control on the page is behind it - including the sticky
  header's. That is the truth of an open modal, and it is why the "partly overlapped is still
  reachable" guard lives in its own fixture (sticky-overlap.html) rather than here.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Scrim fixture</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.4 system-ui,
          sans-serif;
      }
      .sticky-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        background: #fff;
        z-index: 5;
      }
      .page {
        padding: 40px;
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dialog {
        background: #fff;
        padding: 24px;
        width: 420px;
      }
    </style>
  </head>
  <body>
    <div class="sticky-header">
      <button type="button">Menu</button>
    </div>

    <div class="page">
      <h1>Plan your next event</h1>
      <p>Everything you need to invite people and keep track of who came.</p>
      <button type="button">Get started</button>
      <a href="/pricing">See pricing</a>
    </div>

    <div class="scrim">
      <div class="dialog" role="dialog" aria-label="Cookies">
        <h2>We use cookies</h2>
        <p>Choose what we may store in this browser.</p>
        <button type="button">Accept all</button>
        <button type="button">Reject all</button>
      </div>
    </div>
  </body>
</html>
