<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pictures</title>
    <style>
      body {
        margin: 0;
        font: 16px sans-serif;
      }
      .bg {
        width: 300px;
        height: 200px;
        background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20'><rect width='20' height='20' fill='teal'/></svg>");
      }
    </style>
  </head>
  <body>
    <p id="question">This shark photo is forwarded to the chat. Best proof it is fake?</p>
    <img
      id="photo"
      width="400"
      height="300"
      alt="SECRET-ALT-SHARK"
      aria-label="SECRET-ARIA-SHARK"
      title="SECRET-TITLE-SHARK"
      src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='400' height='300' fill='steelblue'/></svg>" />
    <p id="icon-row">
      Small things:
      <img
        id="icon"
        width="16"
        height="16"
        alt="SECRET-ALT-ICON"
        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16'><rect width='16' height='16' fill='red'/></svg>" />
    </p>
    <button id="send" type="button">
      <img
        width="200"
        height="120"
        alt="SECRET-ALT-BUTTON"
        src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='120'><rect width='200' height='120' fill='orange'/></svg>" />Send
    </button>
    <img id="broken" width="200" height="150" alt="SECRET-ALT-BROKEN" src="data:image/png;base64,AAAA" />
    <img
      id="gone"
      width="200"
      height="150"
      alt="SECRET-ALT-GONE"
      style="display: none"
      src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='150'><rect width='200' height='150' fill='green'/></svg>" />
    <canvas id="chart" width="300" height="200" aria-label="SECRET-ARIA-CANVAS"></canvas>
    <div class="bg" id="wallpaper" aria-label="SECRET-ARIA-BG"></div>
    <script>
      const ctx = document.getElementById("chart").getContext("2d");
      ctx.fillStyle = "purple";
      ctx.fillRect(0, 0, 300, 200);
    </script>
  </body>
</html>
