<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tables and code</title>
    <style>
      body { font-family: sans-serif; font-size: 16px; }
    </style>
  </head>
  <body>
    <h1>Webhooks</h1>
    <table>
      <caption>Events we send</caption>

    <pre><code>{ "event": "rename", "guildId": "123" }</code></pre>
