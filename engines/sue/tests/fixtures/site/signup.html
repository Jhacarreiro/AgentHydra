<!-- signup.html - the fixture site's account-creation form.
     Why it exists: exercises the body's field-typing contract (sue/body.mjs's `type` tool
     substitutes my-first-name / my-last-name / my-email / my-phone / my-birthday) and its two
     hard refusals: a hidden honeypot input the body must never fill, and the "Send me a code"
     control the body's OTP-latency clock starts from. POSTs to /request-code, served by
     sue/tests/fixture-server.mjs.
     Depends on it: sue/tests/fixture-server.mjs (serves this file, handles the POST) and
     sue/tests/e2e-fixture.spec.mjs. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up - Moments</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <a class="brand" href="/">Moments</a>
    <button class="icon-only" type="button" aria-label="Menu">&#9776;</button>
  </header>

  <main class="form-page">
    <h1>Create your account</h1>
    <form method="post" action="/request-code">
      <div class="field">
        <label for="firstName">First name</label>
        <input id="firstName" name="firstName" type="text" autocomplete="given-name" required />
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input id="lastName" name="lastName" type="text" autocomplete="family-name" required />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" required />
      </div>
      <div class="field">
        <label for="birthday">Birthday</label>
        <input id="birthday" name="birthday" type="text" placeholder="YYYY-MM-DD" autocomplete="bday" required />
      </div>

      <!-- Honeypot: real users and SUE's body never see or fill this. Any submission that
           arrives with it non-empty is treated as a bot and silently dropped by
           fixture-server.mjs (no code is ever sent). -->
      <div class="field honeypot-field" aria-hidden="true">
        <label for="companyWebsite">Company website</label>
        <input id="companyWebsite" name="companyWebsite" type="text" tabindex="-1" autocomplete="off" />
      </div>

      <button class="submit" type="submit">Send me a code</button>
    </form>
  </main>

  <footer>
    <p class="fine-print">By continuing you agree to the Terms and acknowledge the Privacy policy.</p>
  </footer>
</body>
</html>
