     pointed at a real target. This page is deliberately vague on purpose - "Where moments become
     memories" says nothing about what the product actually does - so the comprehension scoring
     in sue/report.mjs has a real no-idea/wrong-idea case to catch, and the hamburger is
     icon-only so techProwess 1-2 personas see "[a small picture button with no words]" per
     sue/lib/perception.mjs.

     sue/tests/e2e-fixture.spec.mjs (asserts it serves 200). -->
