<!-- app.html - the fixture site's signed-in home.
     Why it exists: the landing page a Sue should end up on after a successful signup - the
     `expectedLandingAfterSignup` pattern in sue/targets/fixture.json is checked against
     this page's URL, and the "Welcome, <name>" text plus a short events list give a comprehension
     surface (does she now believe this is an events product) without needing a real backend.
     The name is templated in by fixture-server.mjs from the `name` query param it set on the
     /verify-code redirect.
     Depends on it: sue/tests/fixture-server.mjs (serves + templates this file) and
     sue/tests/e2e-fixture.spec.mjs. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home - Moments</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <a class="brand" href="/">Moments</a>
    <button class="icon-only" type="button" aria-label="Menu">&#9776;</button>
  </header>

  <main class="welcome">
    <h1>Welcome, __NAME__</h1>
    <p>Here's what's happening near you.</p>
    <ul class="events">
      <li>Thursday night trivia at The Wren - 7:00 PM</li>
      <li>Saturday farmers market meetup - 9:00 AM</li>
      <li>Community garden cleanup - 11:00 AM Sunday</li>
    </ul>
  </main>
</body>
</html>
