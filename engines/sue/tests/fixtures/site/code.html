<!-- code.html - the fixture site's "check your email" step.
     Why it exists: the half of the flow that measures OTP latency (sue/body.mjs's
     check_email / otpEmailLatencyMs) - a Sue lands here right after /request-code and has to
     wait for, find and type the six-digit code fixture-server.mjs mailed her. The email address
     rides along as a hidden field (templated in by the server from the query string) so
     /verify-code knows whose code to check without SUE ever seeing a selector or URL param.
     Depends on it: sue/tests/fixture-server.mjs (serves + templates this file, handles the
     POST to /verify-code) and sue/tests/e2e-fixture.spec.mjs. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Enter your code - Moments</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <a class="brand" href="/">Moments</a>
    <button class="icon-only" type="button" aria-label="Menu">&#9776;</button>
  </header>

  <main class="form-page">
    <h1>Check your email</h1>
    <p>We sent a six-digit code to __EMAIL__. Enter it below.</p>
    __ERROR__
    <form method="post" action="/verify-code">
      <input type="hidden" name="email" value="__EMAIL__" />
      <div class="field">
        <label for="code">Six-digit code</label>
        <input id="code" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required />
      </div>
      <button class="submit" type="submit">Continue</button>
    </form>
  </main>
</body>
</html>
