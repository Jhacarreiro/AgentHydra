<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page Vanish</title>
    <style>
      body {
        font: 18px/1.5 sans-serif;
        margin: 24px;
      }
      a {
        display: inline-block;
        padding: 14px 18px;
        margin-top: 16px;
        background: #e8f0fe;
        color: #0b3d91;
        border-radius: 8px;
      }
    </style>
    <script>
      // Once the body has named the link (data-sue-id), it is gone: the inventory shows it, a tap finds nothing.
      new MutationObserver((records) => records.forEach((r) => r.target.tagName === "A" && r.target.remove())).observe(
        document.documentElement,
        { attributes: true, attributeFilter: ["data-sue-id"], subtree: true },
      );
    </script>
  </head>
  <body>
    <h1>Page Vanish</h1>
    <p>A page whose link goes away the moment it is named, so a tap on it fails.</p>
    <a href="/c">Slippery</a>
  </body>
</html>
